<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMANA PACKAGING — Packaging & Protection Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F9FC; --surface:#FFFFFF; --ink:#112638; --muted:#566B7C; --line:#D9E4EB;
  --film:#17709A; --film-ink:#FFFFFF; --alert:#F2B705; --alert-ink:#3A2C00; --danger:#B3261E;
  --bub-a:#CBEAF7; --bub-b:#3C9DC8; --bub-off:#D3DFE6;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --text:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A24; --surface:#152634; --ink:#E4EEF4; --muted:#93A8B8; --line:#27394A;
    --film:#5BBBE3; --film-ink:#06202D; --danger:#FF8A80;
    --bub-a:#8FD3EE; --bub-b:#2B7FA6; --bub-off:#223647;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A24; --surface:#152634; --ink:#E4EEF4; --muted:#93A8B8; --line:#27394A;
  --film:#5BBBE3; --film-ink:#06202D; --danger:#FF8A80;
  --bub-a:#8FD3EE; --bub-b:#2B7FA6; --bub-off:#223647;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--text);-webkit-text-size-adjust:100%}
.app{max-width:720px;margin:0 auto;padding:0 16px 150px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--film);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:10px;border-bottom:1px solid var(--line)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font:700 30px/1.1 var(--display);letter-spacing:.01em}
.link{background:none;border:0;color:var(--muted);padding:8px 0;min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tabs{display:flex;gap:16px;overflow-x:auto}
.tabs button{white-space:nowrap}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 0 9px;min-height:44px;font:600 18px/1 var(--display);color:var(--muted);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--film)}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 16px;margin:16px 0 8px}
.stats:empty{display:none}
@media (min-width:560px){.stats{grid-template-columns:repeat(3,1fr)}}
.stats dt{font-size:13px;color:var(--muted)}
.stats dd{margin:0;font:700 24px/1.15 var(--display);font-variant-numeric:tabular-nums}
.note{margin:8px 0 0;font-size:14px;color:var(--muted)}

h2{margin:24px 0 10px;font:600 19px/1.2 var(--display);display:flex;gap:10px;align-items:baseline}
h2 span{font:400 14px var(--text);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card.low{border-left:5px solid var(--alert)}
.card.out{border-left:5px solid #D32F2F}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
h3{margin:0;font:700 22px/1.15 var(--display)}
.sub{margin:2px 0 0;font-size:14px;color:var(--muted)}
.rest{text-align:right;flex:none}
.rest strong{display:block;font:700 42px/1 var(--display);font-variant-numeric:tabular-nums}
.rest strong.sum{font-size:28px}
.rest span{font-size:13px;color:var(--muted)}
.status{display:flex;align-items:center;gap:8px;margin:6px 0 0;font-size:14px;font-weight:600}
.led{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none}
.status.ok .led{background:radial-gradient(circle at 35% 30%,#c5f7d8 0 16%,#2fb866 45%,#1c8a47 100%);box-shadow:0 0 0 3px rgba(47,184,102,.28),inset 0 -2px 3px rgba(0,0,0,.25)}
.status.out .led{background:radial-gradient(circle at 35% 30%,#ffc9c4 0 16%,#e5413a 45%,#b3261e 100%);box-shadow:0 0 0 3px rgba(229,65,58,.3),inset 0 -2px 3px rgba(0,0,0,.25)}
.bubbles{display:flex;gap:5px;margin-top:12px}
.bubble{flex:1 1 0;max-width:26px;aspect-ratio:1;border-radius:50%}
.bubble.on{background:radial-gradient(circle at 32% 28%,#fff 0 11%,var(--bub-a) 12% 40%,var(--bub-b) 100%);box-shadow:inset 0 -2px 3px rgba(0,0,0,.2)}
.bubble.off{background:var(--bub-off);box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.low .bubble.on{--bub-a:#FFE08A;--bub-b:#D99A00}
.tag{display:inline-block;margin:12px 0 0;padding:3px 10px;border-radius:99px;background:var(--alert);color:var(--alert-ink);font-size:14px;font-weight:600}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:14px 0 0}
.metrics dt{font-size:13px;color:var(--muted)}
.metrics dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.lots{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.lots h4{margin:0;font:600 14px/1.3 var(--text);color:var(--muted)}
.lotshead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.btn.small{min-height:38px;padding:0 12px;font-size:14px}
.lot{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lot:last-child{border-bottom:0}
.lot small{display:block;font-size:13px;color:var(--muted)}
.lot .q{font-weight:600}
.undo{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:36px;padding:0}
.card .undo.solo{margin-top:6px}
.metrics .wide{grid-column:1/-1}
.gain{font-weight:700}
.gain.pos{color:#1C7A45}
.gain.neg{color:var(--danger)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gain.pos{color:#5FD08A}}
:root[data-theme="dark"] .gain.pos{color:#5FD08A}
.rlt{margin-bottom:4px}
.rl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.rl:last-child{border-bottom:0}
.rl .n{display:flex;align-items:center;gap:8px;min-width:0}
.rl .status{margin:0}
.rl>b{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.rl small{font:400 13px var(--text);color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:14px}
.actions .btn{flex:1;padding-inline:8px}

.btn{min-height:46px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.btn.primary{background:var(--film);border-color:var(--film);color:var(--film-ink)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
:root[data-theme="dark"] .btn.danger{color:#2A0A07}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.danger{color:#2A0A07}}

.empty{margin:32px 0;color:var(--muted)}
.empty .btn{margin-top:12px}
.more{margin:12px 0;color:var(--muted);font-size:14px}
.tagline{margin:0;font-size:14px;color:var(--muted)}
.tabs{gap:6px}
.tabs button{padding:8px 11px 9px;font-weight:700;border-radius:8px 8px 0 0}
.tabs button[aria-current="page"]{background:var(--film);color:var(--film-ink);border-bottom-color:var(--film)}
div.seg button{font-weight:700}
.lot small .undo{min-height:28px;display:inline;font-size:13px;margin-left:6px}
.card .undo.solo{margin-right:16px}
.logo-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 12px;display:flex;justify-content:center;margin-top:16px}
.logo{width:min(260px,100%);height:auto}
.logo-card{padding:0;overflow:hidden;background:#0b0f14;border-color:#0b0f14}
.banner{display:block;width:100%;height:auto}
.welcome{display:block;margin:20px 0 8px;font:700 26px/1.2 var(--display)}
.welcome-p{margin:0;color:var(--muted)}
.btn.wide{width:100%;margin-top:12px}
.clock{margin:2px 0 0;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.clock::first-letter{text-transform:uppercase}
.client{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 14px;margin-bottom:10px}
.client summary{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 0;cursor:pointer;list-style:none}
.client summary::-webkit-details-marker{display:none}
.client summary::after{content:"▾";color:var(--muted)}
.client[open] summary{border-bottom:1px solid var(--line)}
.client .cn{flex:1;min-width:0;font:700 20px/1.2 var(--display)}
.client .cs{text-align:right;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.client .cs b{display:block;color:var(--ink);font-size:16px}
.lot.c2{grid-template-columns:1fr auto}
.alertbar{display:block;width:100%;text-align:left;margin-top:10px;padding:10px 12px;border-radius:8px;border:0;cursor:pointer;font-size:15px;line-height:1.35}
.alertbar.out{background:#D32F2F;color:#fff}
.alertbar.low{background:var(--alert);color:var(--alert-ink)}
.sw{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px;cursor:pointer}
.sw input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--film)}
.sw small{display:block;color:var(--muted);font-size:13px}
.filters{margin-top:14px}
.filters label{display:block;margin:0 0 10px;font-size:14px;color:var(--muted)}
.filters input,.filters select{display:block;width:100%;margin-top:4px;min-height:46px;padding:8px 10px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
@media (max-width:559px){.stats>div:last-child:nth-child(odd){grid-column:1/-1}}

.seg{display:flex;margin:16px 0 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;background:var(--surface);color:var(--muted);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--film);color:var(--film-ink)}
.sheetbar{display:flex;gap:10px;margin:16px 0 12px}
.sheetbar .btn{flex:1}
.sheetwrap{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.sheetwrap .sheet table{min-width:680px}

.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock div{max-width:720px;margin:0 auto;display:flex;gap:10px}
.dock .btn{flex:1}
.dock .primary{flex:1.6}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(460px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(8,18,28,.6)}
.dform{padding:18px}
.dform h2{margin:0 0 12px;font:700 24px/1.15 var(--display);display:block}
.dform label{display:block;margin:0 0 12px;font-size:14px;color:var(--muted)}
.dform input,.dform select{display:block;width:100%;margin-top:4px;min-height:46px;padding:8px 10px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.dform .chk{display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.dform .chk input{width:auto;min-height:0;margin:3px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hint{margin:-4px 0 12px;font-size:14px;color:var(--muted)}
.total{margin:4px 0 12px;font:700 22px/1.2 var(--display)}
.err{margin:0 0 12px;color:var(--danger);font-weight:600}
.dactions{display:flex;gap:10px;margin-top:6px}
.dactions .btn{flex:1}
.dform .btn.danger.block{width:100%;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  html,body{background:#fff}
  :root{padding:0}
  .top,.stats,.note,.dock,.sheetbar,.seg,.alertbar,dialog{display:none!important}
  .app{padding:0;max-width:none}
  .sheetwrap{border:0;overflow:visible}
  .sheetwrap .sheet table{min-width:0}
  .sheet .tw{overflow:visible}
}

/* Navigation du bas */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(8,18,28,.08)}
.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:12px;margin:0 2px;font:600 12px/1 var(--text);position:relative}
.bnav button svg{width:24px;height:24px}
.bnav button[aria-current="page"]{color:var(--film-ink);background:var(--film)}
.bnav button:active{transform:scale(.96)}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:8px;min-height:52px;padding:0 20px 0 16px;border:0;border-radius:99px;background:var(--alert);color:var(--alert-ink);font:700 17px/1 var(--text);cursor:pointer;box-shadow:0 6px 18px rgba(8,18,28,.28)}
.fab:active{transform:scale(.96)}
.top{padding-bottom:6px}
.clientline{margin:6px 0 0;font-size:16px;font-weight:600;color:var(--ink)}
.clientline span{font-weight:400;color:var(--muted)}
@media print{.bnav,.fab{display:none!important}}

/* Menu des onglets en haut */
.bnav{position:static;z-index:auto;box-shadow:none;border-top:0;background:none;padding:8px 0 6px;gap:4px}
.bnav button{min-height:56px;margin:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;gap:4px;font-size:12px}
.bnav button[aria-current="page"]{background:var(--film);border-color:var(--film);color:var(--film-ink)}
.fab{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.app{padding-bottom:100px}
.fab[hidden]{display:none}
.fab2{bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--film);color:var(--film-ink)}

<button class="fab fab2" id="btnArr" type="button" aria-label="Arrivage"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span>Arrivage</span></button>

<dialog id="dlg"></dialog>

<script>
(function(){
"use strict";
var LS_KEY="stock-ventes-emballage-v1";
var TYPES={
  etirable:{label:"Film étirable",ph:"Film étirable transparent 2,3 kg"},
  bulles:{label:"Film à bulles d'air",ph:"Film à bulles d'air 1,2 m × 100 m"}
};
var DB=null, ready=false, tab="accueil", sheetKind="facture", venteView="resume", filt={pid:"",cli:"",from:"",to:""}, stockView="stock", ffilt={sup:"",from:"",to:""};
var S={produits:[],devise:"TND",mouvements:[],clients:[],fournisseurs:[]};
function fixDevise(){return "TND"}

var $=function(s){return document.querySelector(s)};
var esc=function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var nf=new Intl.NumberFormat("fr-FR",{maximumFractionDigits:2});
var nf3=new Intl.NumberFormat("fr-FR",{minimumFractionDigits:3,maximumFractionDigits:3});
var round3=function(n){return Math.round(n*1000)/1000};
var money=function(n){return nf3.format(round3(n||0))+"\u00a0"+esc(S.devise)};
var qty=function(n){return nf.format(n||0)};
var num=function(v){return Number(String(v).replace(",","."))};
var uid=function(){return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
var todayStr=function(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
var dateIso=function(ds){return ds===todayStr()?new Date().toISOString():new Date(ds+"T12:00:00").toISOString()};
var fmtDate=function(iso){return new Date(iso).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"})};
var byDateDesc=function(a,b){return a.date<b.date?1:a.date>b.date?-1:0};
var byDateAsc=function(a,b){return a.date<b.date?-1:a.date>b.date?1:0};
var prod=function(id){return S.produits.find(function(p){return p.id===id})};
var restant=function(p){return (p.recu||0)-(p.vendu||0)};
var isLow=function(p){var r=restant(p);return r<=0||(p.seuil>0&&r<=p.seuil)};
var lotPrice=function(x,p){return x.achat!=null?x.achat:((p&&p.achat)||0)};
var avgAchat=function(p){
  var q=0,c=0;
  S.mouvements.forEach(function(x){if(x.type==="reception"&&x.produitId===p.id){q+=x.delta;c+=x.delta*lotPrice(x,p)}});
  return q>0?c/q:(p.achat||0);
};
var priceNote=function(p){
  var set={};
  S.mouvements.forEach(function(x){if(x.type==="reception"&&x.produitId===p.id)set[lotPrice(x,p)]=1});
  return Object.keys(set).length>1?" (moyen)":"";
};
var achatOf=function(x){var p=prod(x.produitId);return x.achat!=null?x.achat:(p?avgAchat(p):0)};
var sortedByType=function(k){return S.produits.filter(function(p){return p.type===k}).sort(function(a,b){return a.nom.localeCompare(b.nom,"fr",{numeric:true})})};
var ventesList=function(){return S.mouvements.filter(function(x){return x.type==="vente"})};
var unitOf=function(p){return (p&&p.unite)||"rouleau"};
var findC=function(kind,name){var k=String(name||"").trim().toLowerCase();return (S[kind]||[]).find(function(c){return String(c.nom||"").trim().toLowerCase()===k})||null};
var ctTel=function(kind,name){var c=findC(kind,name);return c?[c.tel,c.mf?"M.F "+c.mf:""].filter(Boolean).join(" / "):""};
var unitLbl=function(p,n){var u=unitOf(p);if(Math.abs(n)>=2){if(/(eau|au)$/i.test(u))return u+"x";if(/[sxz]$/i.test(u))return u;return u+"s"}return u};

/* ---------- Persistance ---------- */
function loadLocal(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(raw){var o=JSON.parse(raw);S={produits:o.produits||[],devise:fixDevise(o.devise),mouvements:o.mouvements||[],clients:o.clients||[],fournisseurs:o.fournisseurs||[]}}
  }catch(e){}
}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
async function saveEtat(){
  if(DB){await DB.doc("stock/etat").set({produits:S.produits,devise:S.devise,clients:S.clients||[],fournisseurs:S.fournisseurs||[]})}else{saveLocal()}
}
async function putMvt(m){
  if(DB){await DB.doc("mouvements/"+m.id).set(m)}else{saveLocal()}
}
async function delMvt(id){
  if(DB){await DB.doc("mouvements/"+id).delete()}else{saveLocal()}
}
async function loadDb(){
  var d=await DB.doc("stock/etat").get();
  if(d.exists){
    var o=d.data();
    S.produits=Array.isArray(o.produits)?o.produits.map(function(x){return Object.assign({},x)}):[];
    S.devise=fixDevise(o.devise);
    S.clients=Array.isArray(o.clients)?o.clients:[];S.fournisseurs=Array.isArray(o.fournisseurs)?o.fournisseurs:[];
  }
  var q=await DB.collection("mouvements").orderBy("date","desc").limit(1000).get();
  S.mouvements=q.docs.map(function(x){return Object.assign({},x.data())});
}
async function tx(mutate,persist){
  var snap=JSON.stringify(S);
  mutate();
  try{await persist()}
  catch(e){S=JSON.parse(snap);throw e}
  finally{render()}
}

/* ---------- Onglet Stock ---------- */
function gauge(p){
  var r=restant(p);
  var ref=p.seuil>0?p.seuil*4:Math.max(r,10);
  var on=Math.round(Math.min(Math.max(r,0)/ref,1)*12);
  if(r>0&&on===0)on=1;
  var h="";
  for(var i=0;i<12;i++)h+='<span class="bubble '+(i<on?"on":"off")+'"></span>';
  return '<div class="bubbles" aria-hidden="true">'+h+"</div>";
}
function lotsHtml(p){
  var lots=S.mouvements.filter(function(x){return x.type==="reception"&&x.produitId===p.id}).sort(byDateDesc);
  var h='<div class="lots"><div class="lotshead"><h4>Historique des arrivages</h4><button class="btn small" type="button" data-act="reception" data-id="'+p.id+'">Ajouter un arrivage</button></div>';
  if(!lots.length)return h+'<p class="sub">Aucun arrivage enregistré.</p></div>';
  return h+lots.map(function(x){
    return '<div class="lot"><div>'+fmtDate(x.date)+(x.note?" ("+esc(x.note.toLowerCase())+")":"")+'<small>Prix unitaire d\'achat (TTC) : '+money(lotPrice(x,p))+'</small>'+'<small>Total d\'achat (TTC) : <b>'+money(x.delta*lotPrice(x,p))+'</b></small>'+'<small>Fournisseur : '+esc(x.fournisseur||"non renseigné")+'</small>'+'<small><button class="undo" type="button" data-act="editarr" data-id="'+x.id+'">Modifier</button></small>'+'</div><div class="q">+'+qty(x.delta)+" "+esc(unitLbl(p,x.delta))+'</div>'+
      '<button class="undo" type="button" data-act="annuler" data-id="'+x.id+'">Annuler</button></div>';
  }).join("")+"</div>";
}
var openLots={};
function arrNotes(p){
  var a=S.mouvements.filter(function(x){return x.type==="reception"&&x.produitId===p.id}).sort(byDateDesc);
  if(!a.length)return "";
  return '<div class="notes"><p class="nh">Arrivages</p>'+a.slice(0,3).map(function(x){return '<p><b>'+fmtDate(x.date)+'</b> · Fournisseur : '+esc(x.fournisseur||"non renseigné")+' · +'+qty(x.delta)+'</p>'}).join("")+(a.length>3?'<p>+ '+(a.length-3)+(a.length-3>1?" autres arrivages":" autre arrivage")+'</p>':"")+'</div>';
}
function card(p){
  var r=restant(p),low=isLow(p);
  return '<article class="card'+(low?" low":"")+(r<=0?" out":"")+'">'+
    '<div class="head"><div><h3>'+esc(p.nom)+'</h3>'+
    '<p class="status '+(r>0?"ok":"out")+'"><i class="led" aria-hidden="true"></i>'+(r>0?"Disponible en stock":"Rupture de stock")+'</p></div>'+
    '<div class="rest"><strong>'+qty(r)+'</strong><span>Quantité restante</span></div></div>'+
    gauge(p)+
    (low&&r>0?'<p class="tag">Sous le seuil de '+qty(p.seuil)+"</p>":"")+
    '<dl class="metrics">'+
      '<div><dt>Quantité totale</dt><dd>'+qty(p.recu)+"</dd></div>"+
      '<div><dt>Unité de vente</dt><dd>'+esc(unitOf(p).charAt(0).toUpperCase()+unitOf(p).slice(1))+"</dd></div>"+
      '<div><dt>Prix unitaire d\'achat (TTC)'+priceNote(p)+'</dt><dd>'+(avgAchat(p)>0?money(avgAchat(p)):"—")+"</dd></div>"+
      '<div><dt>Prix unitaire de vente (TTC)</dt><dd>'+money(p.prix)+"</dd></div>"+
    "</dl>"+
    arrNotes(p)+
    
    '<div class="actions">'+
      
      '<button class="btn ghost" type="button" data-act="edit" data-id="'+p.id+'">Modifier</button>'+
    "</div></article>";
}
function viewStock(){
  var seg='<div class="seg" role="group" aria-label="Affichage du dépôt"><button type="button" data-sv="stock" aria-pressed="'+(stockView==="stock")+'">Dépôt</button><button type="button" data-sv="fourn" aria-pressed="'+(stockView==="fourn")+'">Fournisseur</button></div>';
  return seg+(stockView==="fourn"?viewFournisseurs():(S.produits.length?'<button class="btn primary wide" type="button" data-act="newart">Nouvel article</button>':'')+viewStockList());
}
function suppliers(){
  var set={};
  S.mouvements.forEach(function(x){if(x.type==="reception"&&x.fournisseur){var n=String(x.fournisseur).trim();if(n&&!set[n.toLowerCase()])set[n.toLowerCase()]=n}});
  (S.fournisseurs||[]).forEach(function(c){var n=String(c.nom||"").trim();if(n&&!set[n.toLowerCase()])set[n.toLowerCase()]=n});
  return Object.keys(set).map(function(k){return set[k]}).sort(function(a,b){return a.localeCompare(b,"fr")});
}
function fournOptions(){return suppliers().map(function(n){return '<option value="'+esc(n)+'">'}).join("")}
function filteredArrivals(){
  var f0=ffilt.from?new Date(ffilt.from+"T00:00:00").toISOString():"";
  var f1=ffilt.to?new Date(ffilt.to+"T23:59:59").toISOString():"";
  return S.mouvements.filter(function(x){
    if(x.type!=="reception")return false;
    var f=String(x.fournisseur||"").trim().toLowerCase();
    if(ffilt.sup==="__none"){if(f)return false}
    else if(ffilt.sup&&f!==ffilt.sup.toLowerCase())return false;
    if(f0&&x.date<f0)return false;
    if(f1&&x.date>f1)return false;
    return true;
  }).sort(byDateDesc);
}
function viewFournisseurs(){
  var list=filteredArrivals(),tq=0,tt=0;
  var rows=list.slice(0,300).map(function(x){
    var pa=lotPrice(x,prod(x.produitId)),q=x.delta;
    return '<article class="card"><div class="head"><div><h3>'+esc(x.nom)+'</h3><p class="sub">'+fmtDate(x.date)+'</p><p class="sub">Fournisseur : '+esc(x.fournisseur||"non renseigné")+'</p></div><div class="rest"><strong class="sum">+'+qty(q)+'</strong><span>Quantité</span></div></div>'+
      '<dl class="metrics"><div><dt>Prix unitaire d\'achat (TTC)</dt><dd>'+money(pa)+'</dd></div><div><dt>Total d\'achat (TTC)</dt><dd>'+money(q*pa)+'</dd></div></dl>'+
      '<button class="undo solo" type="button" data-act="editarr" data-id="'+x.id+'">Modifier l\'arrivage</button><button class="undo solo" type="button" data-act="annuler" data-id="'+x.id+'">Annuler cet arrivage</button></article>';
  }).join("");
  list.forEach(function(x){tq+=x.delta;tt+=x.delta*lotPrice(x,prod(x.produitId))});
  var all=S.mouvements.filter(function(x){return x.type==="reception"});
  var hasNone=all.some(function(x){return !String(x.fournisseur||"").trim()});
  var opts='<option value="">Tous les fournisseurs</option>'+suppliers().map(function(n){return '<option value="'+esc(n)+'"'+(ffilt.sup.toLowerCase()===n.toLowerCase()?" selected":"")+'>'+esc(n)+'</option>'}).join("")+(hasNone?'<option value="__none"'+(ffilt.sup==="__none"?" selected":"")+'>Sans fournisseur</option>':'');
  return '<button class="btn primary wide" type="button" data-act="newcontact" data-ck="fournisseurs">Ajouter un fournisseur</button>'+suppliersCardHtml()+
    '<div class="filters"><label>Fournisseur<select data-ffilter="sup">'+opts+'</select></label>'+
    '<div class="two"><label>Du<input type="date" data-ffilter="from" value="'+esc(ffilt.from)+'"></label><label>Au<input type="date" data-ffilter="to" value="'+esc(ffilt.to)+'"></label></div>'+
    (ffilt.sup||ffilt.from||ffilt.to?'<button class="undo" type="button" data-act="resetff">Réinitialiser les filtres</button>':'')+'</div>'+
    '<dl class="stats"><div><dt>Arrivages</dt><dd>'+qty(list.length)+'</dd></div><div><dt>Quantité reçue</dt><dd>'+qty(tq)+'</dd></div><div><dt>Somme d\'achat</dt><dd>'+money(tt)+'</dd></div></dl>'+
    (ffilt.sup||ffilt.from||ffilt.to?(rows||'<div class="empty"><p>Aucun arrivage ne correspond à cette recherche.</p></div>'):'<div class="empty"><p>Choisissez un fournisseur ou une période pour afficher les arrivages.</p></div>');
}
function viewStockList(){
  if(!S.produits.length){
    return '<div class="empty"><p>Aucun article pour l\'instant. Ajoutez votre premier film étirable ou film à bulles d\'air.</p>'+
      '<button class="btn primary" type="button" data-act="newart">Ajouter un article</button></div>';
  }
  var h="";
  Object.keys(TYPES).forEach(function(t){
    var list=sortedByType(t);
    if(!list.length)return;
    h+='<h2 class="fam">'+esc(TYPES[t].label)+"<span>"+list.length+(list.length>1?" articles":" article")+"</span></h2>"+list.map(card).join("");
  });
  return h;
}

/* ---------- Onglet Vente ---------- */
function stats(){
  var now=new Date();
  var d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).toISOString();
  var m0=new Date(now.getFullYear(),now.getMonth(),1).toISOString();
  var j=0,m=0,tot=0,va=0,vv=0,rest=0,gain=0,ach=0;
  ventesList().forEach(function(x){
    var t=-x.delta*x.prix;
    tot+=t;ach+=(-x.delta)*achatOf(x);gain=tot-ach;
    if(x.date>=m0)m+=t;
    if(x.date>=d0)j+=t;
  });
  S.produits.forEach(function(p){
    var r=Math.max(0,restant(p));
    va+=r*avgAchat(p);vv+=r*p.prix;rest+=r;
  });
  return {j:j,m:m,tot:tot,ach:ach,gain:gain,va:va,vv:vv,rest:rest};
}
function statsHtml(){
  var s=stats();
  return "<div><dt>Ventes du jour</dt><dd>"+money(s.j)+"</dd></div>"+
    "<div><dt>Ventes du mois</dt><dd>"+money(s.m)+"</dd></div>"+
    "<div><dt>Somme de vente (TTC)</dt><dd>"+money(s.tot)+"</dd></div>"+
    "<div><dt>Somme d'achat (TTC)</dt><dd>"+money(s.ach)+"</dd></div>"+
    "<div><dt>Gain total</dt><dd>"+money(s.gain)+"</dd></div>"+
    
    
    "";
}
function restListHtml(){
  if(!S.produits.length)return "";
  var all=[];
  Object.keys(TYPES).forEach(function(k){all=all.concat(sortedByType(k))});
  var tot=0;
  var rows=all.map(function(p){
    var r=restant(p);tot+=Math.max(0,r);
    return '<div class="rl"><span class="n"><span class="status '+(r>0?"ok":"out")+'"><i class="led" aria-hidden="true"></i></span>'+esc(p.nom)+'</span><b>'+qty(r)+'</b></div>';
  }).join("");
  return '<section class="card"><h3 class="rlt">Quantité restante par article</h3>'+rows+'</section>';
}
function filteredVentes(){
  var f0=filt.from?new Date(filt.from+"T00:00:00").toISOString():"";
  var f1=filt.to?new Date(filt.to+"T23:59:59").toISOString():"";
  return ventesList().filter(function(x){
    if(filt.pid&&x.produitId!==filt.pid)return false;
    var cn=String(x.client||"").trim().toLowerCase();
    if(filt.cli==="__none"){if(cn)return false}else if(filt.cli&&cn!==filt.cli.toLowerCase())return false;
    if(f0&&x.date<f0)return false;
    if(f1&&x.date>f1)return false;
    return true;
  }).sort(byDateDesc);
}

  var all=filteredVentes(),sv=0,sa=0;

    '<dl class="stats"><div><dt>Nombre de ventes</dt><dd>'+qty(all.length)+'</dd></div><div><dt>Somme de vente</dt><dd>'+money(sv)+'</dd></div><div><dt>Somme d\'achat</dt><dd>'+money(sa)+'</dd></div><div><dt>Gain</dt><dd>'+money(sv-sa)+'</dd></div></dl>'+
    viewVenteList();

        '<div><dt>Prix unitaire d\'achat (TTC)</dt><dd>'+money(pa)+'</dd></div>'+
        '<div><dt>Prix unitaire de vente (TTC)</dt><dd>'+money(x.prix)+'</dd></div>'+
        '<div><dt>Somme d\'achat (TTC)</dt><dd>'+money(q*pa)+'</dd></div>'+
        '<div class="wide"><dt>Gain (somme de vente − somme d\'achat)</dt><dd class="gain '+(q*(x.prix-pa)>=0?"pos":"neg")+'">'+(q*(x.prix-pa)>=0?"+":"−")+money(Math.abs(q*(x.prix-pa)))+'</dd></div>'+
      '</dl>'+
      (x.ancien?'<p class="sub">Ancienne vente : stock non modifié</p>':'')+
      (function(){var inv=docLoad().hist.filter(function(h){return h.venteId===x.id})[0];
        return '<div class="actions">'+(inv?'<button class="btn" type="button" data-act="viewinv" data-id="'+x.id+'">Voir la facture '+esc(inv.num)+'</button>':'<button class="btn primary" type="button" data-act="mkinv" data-id="'+x.id+'">Créer une facture</button>')+'</div>'})()+

function bilanInner(){
  var t={n:S.produits.length,init:0,vendu:0,rest:0,out:0};
  S.produits.forEach(function(p){
    var r=restant(p);
    t.init+=p.recu||0;t.vendu+=p.vendu||0;t.rest+=r;
    if(r<=0)t.out++;
  });
  var h='<p class="co">AMANA PACKAGING</p><h1>Bilan du stock</h1><p class="date">Situation au '+esc(nowLabel())+'</p>';
  var sum=[["Nombre d'articles",qty(t.n)],["Stock initial",qty(t.init)],["Quantité vendue",qty(t.vendu)],["Quantité restante",qty(t.rest)],["Articles disponibles",qty(t.n-t.out)],["Articles en rupture de stock",qty(t.out)]];

function bilanGeneralInner(){
  var ventes=ventesList(),tq=0,ts=0,ta=0,by={};
  ventes.forEach(function(x){
    var q=Math.abs(x.delta),pa=achatOf(x);
    tq+=q;ts+=q*x.prix;ta+=q*pa;
    var k=x.produitId||x.nom;
    if(!by[k])by[k]={s:0,a:0};
    by[k].s+=q*x.prix;by[k].a+=q*pa;
  });
  var st={n:S.produits.length,init:0,vendu:0,rest:0,out:0};
  S.produits.forEach(function(p){var r=restant(p);st.init+=p.recu||0;st.vendu+=p.vendu||0;st.rest+=r;if(r<=0)st.out++});
  var dates=ventes.map(function(x){return x.date}).sort();
  var per=dates.length?fmtDate(dates[0])+" au "+fmtDate(dates[dates.length-1]):"—";
  function dl(list){return '<dl class="sum">'+list.map(function(x){return '<div'+(x[2]?' class="tot"':'')+'><dt>'+esc(x[0])+'</dt><dd>'+x[1]+'</dd></div>'}).join("")+'</dl>'}
  var h='<p class="co">AMANA PACKAGING</p><h1>Bilan général</h1><p class="date">Situation au '+esc(nowLabel())+'</p>';
  h+='<h2>Ventes</h2>'+dl([["Nombre de ventes",qty(ventes.length)],["Quantité vendue",qty(tq)],["Période couverte",per],["Somme d'achat",money(ta)],["Somme de vente",money(ts)],["Gain",money(ts-ta),"tot"]]);
  h+='<h2>Dépôt</h2>'+dl([["Nombre d'articles",qty(st.n)],["Stock initial",qty(st.init)],["Quantité vendue",qty(st.vendu)],["Quantité restante",qty(st.rest)],["Articles disponibles",qty(st.n-st.out)],["Articles en rupture de stock",qty(st.out)]]);
  if(!S.produits.length)return h+'<p>Aucun article.</p>';
  var rows="",gs=0,gg=0;
  Object.keys(TYPES).forEach(function(k){
    var list=sortedByType(k);
    if(!list.length)return;
    rows+='<tr class="grp"><td colspan="6">'+esc(TYPES[k].label)+'</td></tr>';
    list.forEach(function(p){
      var r=restant(p),b=by[p.id]||{s:0,a:0};
      gs+=b.s;gg+=b.s-b.a;
      rows+='<tr><td class="l">'+esc(p.nom)+'<small>'+(r<=0?'<span class="dot-out">●</span> Rupture de stock':'<span class="dot-ok">●</span> Disponible')+'</small></td><td>'+qty(p.recu)+'</td><td>'+qty(p.vendu)+'</td><td>'+qty(r)+'</td><td>'+money(b.s)+'</td><td>'+money(b.s-b.a)+'</td></tr>';
    });
  });
  h+='<h2>Détail par article</h2><div class="tw"><table><thead><tr><th class="l">Article</th><th>Stock initial</th><th>Quantité vendue</th><th>Quantité restante</th><th>Somme de vente</th><th>Gain</th></tr></thead><tbody>'+rows+
    '</tbody><tfoot><tr><td class="l">Total</td><td>'+qty(st.init)+'</td><td>'+qty(st.vendu)+'</td><td>'+qty(st.rest)+'</td><td>'+money(gs)+'</td><td>'+money(gg)+'</td></tr></tfoot></table></div>';
  return h;
}
function factureInner(){
  var t={n:S.produits.length,init:0,vendu:0,rest:0,achat:0,vente:0};
  var rows="";
  Object.keys(TYPES).forEach(function(k){
    var list=sortedByType(k);
    if(!list.length)return;
    rows+='<tr class="grp"><td colspan="7">'+esc(TYPES[k].label)+'</td></tr>';
    list.forEach(function(p){
      var r=restant(p),pa=avgAchat(p),sa=(p.recu||0)*pa,sv=p.ca||0;
      t.init+=p.recu||0;t.vendu+=p.vendu||0;t.rest+=r;t.achat+=sa;t.vente+=sv;
      rows+='<tr><td class="l">'+esc(p.nom)+'<small>'+(r<=0?'<span class="dot-out">●</span> Rupture de stock':'<span class="dot-ok">●</span> Disponible')+'</small></td><td>'+qty(p.recu)+'</td><td>'+qty(p.vendu)+'</td><td>'+qty(r)+'</td><td>'+money(pa)+(priceNote(p)?'<small>moyen</small>':'')+'</td><td>'+money(sa)+'</td><td>'+money(sv)+'</td></tr>';
    });
  });
  var h='<p class="co">AMANA PACKAGING</p><h1>Facture</h1><p class="date">Situation au '+esc(nowLabel())+'</p>';
  var sum=[["Nombre d'articles",qty(t.n)],["Quantité initiale",qty(t.init)],["Quantité vendue",qty(t.vendu)],["Quantité restante",qty(t.rest)],["Somme totale d'achat",money(t.achat),"tot"],["Somme totale de vente",money(t.vente),"tot"]];
  h+='<h2>Résumé</h2><dl class="sum">'+sum.map(function(x){return '<div'+(x[2]?' class="tot"':'')+'><dt>'+esc(x[0])+'</dt><dd>'+x[1]+'</dd></div>'}).join("")+'</dl>';
  if(!S.produits.length)return h+'<p>Aucun article.</p>';
  h+='<h2>Stock et ventes par article</h2><div class="tw"><table><thead><tr><th class="l">Article</th><th>Quantité initiale</th><th>Quantité vendue</th><th>Quantité restante</th><th>Prix unitaire d\'achat</th><th>Somme d\'achat</th><th>Somme de vente</th></tr></thead><tbody>'+rows+
    '</tbody><tfoot><tr><td class="l">Total</td><td>'+qty(t.init)+'</td><td>'+qty(t.vendu)+'</td><td>'+qty(t.rest)+'</td><td></td><td>'+money(t.achat)+'</td><td>'+money(t.vente)+'</td></tr></tfoot></table></div>';
  h+='<p class="note">La quantité initiale est le total des arrivages. La somme d\'achat est la quantité initiale multipliée par le prix unitaire d\'achat.</p>';
  return h;
}
/* ---------- Documents : modèle commun (facture, bon de commande, devis) ---------- */
var DOC_LS="amana-docs-v1",DOC=null,histIdx=null;
var DK={
  facture:{t:"FACTURE",nl:"N° de facture",pre:"FAC",party:"Client",src:"vente",file:"facture",title:"Facture",sig:"Signature et cachet"},
  commande:{t:"BON DE COMMANDE",nl:"N° de commande",pre:"BC",party:"Fournisseur",src:"achat",file:"bon-de-commande",title:"Bon de commande",sig:"Signature et cachet"},
  devis:{t:"DEVIS",nl:"N° de devis",pre:"DEV",party:"Client",src:"vente",file:"devis",title:"Devis",sig:"Bon pour accord, signature et cachet"}
};
var fm=function(n){return nf3.format(round3(n||0))+"\u00a0TND"};
function docBlank(k){
  var ls=[],i;for(i=0;i<5;i++)ls.push({d:"",q:"",u:"",p:""});
  return {num:DK[k].pre+"-"+new Date().getFullYear()+"-001",date:todayStr(),party:"",mf:"",adr:"",tel:"",lines:ls,tva:"19",esp:false,vir:false,aut:false,autTxt:"",ech:"",paye:""};
}
function docLoad(){
  if(DOC)return DOC;
  DOC={co:{tel:"",mf:""},hist:[]};
  try{
    var o=JSON.parse(localStorage.getItem(DOC_LS)||"null");
    if(o&&typeof o==="object"){
      DOC.co=Object.assign(DOC.co,o.co||{});DOC.hist=Array.isArray(o.hist)?o.hist:[];
      Object.keys(DK).forEach(function(k){if(o[k]&&Array.isArray(o[k].lines))DOC[k]=Object.assign(docBlank(k),o[k])});
    }
  }catch(e){}
  Object.keys(DK).forEach(function(k){if(!DOC[k])DOC[k]=docBlank(k)});
  return DOC;
}
function docSave(){try{localStorage.setItem(DOC_LS,JSON.stringify(DOC))}catch(e){}}
function docNew(k){
  if(k==="facture"){var nf=nextInvNum();DOC[k]=docBlank(k);DOC[k].num=nf;docSave();return}
  var m=String(DOC[k].num).match(/^(.*?)(\d+)$/);
  var nn=m?m[1]+String(Number(m[2])+1).padStart(m[2].length,"0"):docBlank(k).num;
  DOC[k]=docBlank(k);DOC[k].num=nn;docSave();
}
function ttcToHt(v,tva){var t=Number(String(tva).replace(",","."))||0;return Math.round(v/(1+t/100)*1e6)/1e6}
function docCalc(d){
  var ht=0,rows=d.lines.map(function(l){var t=(num(l.q)||0)*(num(l.p)||0);ht+=t;return t});
  var tv=ht*19/100;
  return {rows:rows,ht:ht,tva:tv,ttc:ht+tv};
}
function docPrice(k,name,dd){
  var key=String(name||"").trim().toLowerCase();
  var p=S.produits.find(function(x){return x.nom.trim().toLowerCase()===key});
  if(!p)return null;
  var tva=19;
  if(DK[k].src==="achat")return ttcToHt(avgAchat(p),tva);
  var last=null;
  ventesList().sort(byDateAsc).forEach(function(x){if(x.produitId===p.id)last=x.prix});
  return last==null?null:ttcToHt(last,tva);
}
function f3(v){var n=num(v);return (v===""||v==null||isNaN(n))?"":n.toFixed(3)}

}
function dck(ed,path,on,label){

function curDoc(){return sheetKind==="hist"?DOC.hist[histIdx]:DOC[sheetKind]}
function docDom(){
  var d=curDoc(),cc=docCalc(d);
  d.lines.forEach(function(l,i){var e=document.getElementById("dl"+i);if(e)e.textContent=(l.q!==""||l.p!=="")?fm(cc.rows[i]):""});
  var set=function(id,v){var e=document.getElementById(id);if(e)e.textContent=v};
  set("dht",fm(cc.ht));set("dtva",fm(cc.tva));set("dttc",fm(cc.ttc));
  set("drest",fm(Math.max(0,cc.ttc-(num(d.paye)||0))));
}
function docSet(path,v){
  var p=path.split("."),d=curDoc();
  if(p[0]==="co")DOC.co[p[1]]=v;
  else if(p[0]==="l")d.lines[Number(p[1])][p[2]]=v;
  else d[p[0]]=v;
}
function currentSheet(){
  if(sheetKind==="hist"&&DOC.hist[histIdx]){var hd=DOC.hist[histIdx];return {html:renderDoc("facture",false,hd),file:"facture-"+String(hd.num).replace(/[^\w-]+/g,"_"),title:"Facture "+hd.num}}
  var c=DK[sheetKind]||DK.facture;
  return {html:renderDoc(DK[sheetKind]?sheetKind:"facture",false),file:c.file,title:c.title};
}
function viewFactures(){
  if(!DK[sheetKind]&&sheetKind!=="hist")sheetKind="facture";
  docLoad();
  var seg='<div class="seg" role="group" aria-label="Type de document">'+
    Object.keys(DK).map(function(k){return '<button type="button" data-kind="'+k+'" aria-pressed="'+(sheetKind===k)+'">'+esc(DK[k].title)+'</button>'}).join("")+
    '<button type="button" data-kind="hist" aria-pressed="'+(sheetKind==="hist")+'">Historique</button></div>';
  if(sheetKind==="hist")return seg+histView();
  return seg+
    '<div class="sheetbar"><button class="btn primary" type="button" data-act="print">Imprimer</button>'+
      '<button class="btn" type="button" data-act="dlsheet">Télécharger</button>'+
      '<button class="btn" type="button" data-act="dnew">Nouveau</button></div>'+
    '<div class="sheetwrap"><div class="sheet">'+renderDoc(sheetKind,true)+'</div></div>';
}
function docHas(d){return !!(d&&(String(d.party||"").trim()||d.lines.some(function(l){return l.d||l.q!==""||l.p!==""})))}
function nextInvNum(){
  var D=docLoad(),cur=String(D.facture.num).match(/^(.*?)(\d+)$/);
  if(!cur)return docBlank("facture").num;
  var pre=cur[1],w=cur[2].length,mx=0,nums=D.hist.map(function(x){return x.num});
  if(docHas(D.facture))nums.push(D.facture.num);
  nums.forEach(function(n){var r=String(n).match(/^(.*?)(\d+)$/);if(r&&r[1]===pre)mx=Math.max(mx,Number(r[2]))});
  return pre+String(mx+1).padStart(w,"0");
}
function isoToDs(iso){var d=new Date(iso);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function invoiceFromSale(m){
  var D=docLoad(),d=docBlank("facture"),pp=prod(m.produitId);
  d.num=nextInvNum();d.date=isoToDs(m.date);d.party=m.client||"";d.venteId=m.id;
  var ct=findC("clients",m.client);if(ct){d.tel=ct.tel||"";d.mf=ct.mf||"";d.adr=ct.adr||""}
  d.lines=[{d:m.nom,q:String(-m.delta),u:unitOf(pp),p:String(ttcToHt(m.prix,d.tva))}];
  D.hist.unshift(d);
  if(!docHas(D.facture))D.facture.num=nextInvNum();
  docSave();
  setTab("factures");sheetKind="hist";histIdx=0;
}
function openInvoice(i){
  var D=docLoad();if(!D.hist[i])return;
  setTab("factures");sheetKind="hist";histIdx=i;
  render();window.scrollTo(0,0);
}
function histView(){
  var D=docLoad();
  if(histIdx!=null&&D.hist[histIdx]){
    return '<div class="sheetbar"><button class="btn" type="button" data-act="histback">Retour</button><button class="btn primary" type="button" data-act="print">Imprimer</button><button class="btn" type="button" data-act="dlsheet">Télécharger</button></div>'+
      '<div class="sheetwrap"><div class="sheet">'+renderDoc("facture",true,D.hist[histIdx])+'</div></div>'+
      '<button class="undo solo" type="button" data-act="histdel" data-id="'+histIdx+'">Supprimer cette facture</button>';
  }
  histIdx=null;
  if(!D.hist.length)return '<div class="empty"><p>Aucune facture dans l\'historique. Dans l\'onglet Vente, ouvrez « Détail des ventes », puis touchez « Créer une facture » sur une vente.</p></div>';
  return '<h2>Historique des factures<span>'+D.hist.length+'</span></h2><section class="card">'+D.hist.map(function(x,i){
    return '<div class="lot c2"><div><b>'+esc(x.num)+'</b>'+(x.party?' · '+esc(x.party):'')+'<small>'+(x.date?fmtDate(x.date+"T12:00:00"):"")+' · '+fm(docCalc(x).ttc)+' TTC</small></div><button class="undo" type="button" data-act="openinv" data-id="'+i+'">Ouvrir</button></div>';
  }).join("")+'</section>';
}
var navStack=[],leaving=false,guardOn=false;
function setTab(t){
  if(!t||t===tab)return;
  navStack.push(tab);if(navStack.length>40)navStack.shift();
  tab=t;
}
function pushGuard(){try{history.pushState({amana:1},"");guardOn=true}catch(e){guardOn=false}}
function quitApp(){
  leaving=true;
  try{var C=window.Capacitor;if(C&&C.Plugins&&C.Plugins.App){C.Plugins.App.exitApp();return}}catch(e){}
  try{window.close()}catch(e){}
  try{history.go(guardOn?-2:-1)}catch(e){}
}
function goBack(){
  /* 1. fermer une boîte de dialogue ouverte */
  if(dlg&&dlg.open){dlg.close();return}
  /* 2. sous-onglet -> onglet parent */
  if(tab==="vente"&&venteView!=="resume"){venteView="resume"}
  else if(tab==="stock"&&stockView!=="stock"){stockView="stock"}
  else if(tab==="factures"&&sheetKind==="hist"&&histIdx!=null){histIdx=null}
  else if(tab==="factures"&&sheetKind!=="facture"){sheetKind="facture";histIdx=null}
  /* 3. onglet -> accueil */
  else if(tab!=="accueil"){tab="accueil";navStack=[]}
  /* 4. accueil -> avertissement avant de quitter */
  else{
    openDlg("Quitter l'application ?","<p>Voulez-vous vraiment quitter AMANA PACKAGING ?</p>","Quitter",function(){quitApp()},{danger:true});
    return;
  }
  render();window.scrollTo(0,0);
}
window.addEventListener("popstate",function(){
  if(leaving)return;
  pushGuard();
  goBack();
});
function printSheet(){try{window.print()}catch(e){}}
async function downloadSheet(){
  var dl=null;
  try{if(window.claude&&typeof window.claude.use==="function")dl=await window.claude.use("downloads")}catch(e){dl=null}
  if(!dl){
    openDlg("Téléchargement indisponible","<p>Le téléchargement n'est pas disponible ici. Essayez le bouton Imprimer.</p>","Fermer",function(){});
    return;
  }
  var css=document.getElementById("sheetcss").textContent;
  var cs=currentSheet();
  var doc='<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>'+cs.title+'</title><style>'+css+'body{margin:0;padding:16px;background:#fff}.noprint{margin:0 0 12px}@media print{.noprint{display:none}}</style></head><body><div class="noprint"><button onclick="window.print()">Imprimer</button></div><div class="sheet">'+cs.html+'</div></body></html>';
  try{
    await dl.save({filename:cs.file+"-"+new Date().toISOString().slice(0,10)+".html",data:doc});
  }catch(e){
    if(!e||e.code!=="declined")openDlg("Téléchargement impossible","<p>Le fichier n'a pas pu être enregistré. Réessayez.</p>","Fermer",function(){});
  }
}

function viewBilan(){
  var s=stats(),achats=0,paye=0;
  S.produits.forEach(function(p){achats+=(p.recu||0)*avgAchat(p)});
  var pays=S.mouvements.filter(function(x){return x.type==="paiement"}).sort(byDateDesc);
  pays.forEach(function(x){paye+=x.montant||0});
  var caisse=s.tot-paye,reste=achats-paye;
  var rows=pays.length?pays.map(function(x){
    return '<div class="lot"><div>'+fmtDate(x.date)+(x.note?'<small>'+esc(x.note)+'</small>':'')+'</div><div class="q">'+money(x.montant)+'</div><button class="undo" type="button" data-act="annulerpay" data-id="'+x.id+'">Annuler</button></div>';
  }).join(""):'<p class="sub">Aucun paiement enregistré.</p>';
  return '<article class="card"><div class="head"><div><h3>Caisse</h3><p class="sub">Ventes encaissées moins paiements achats</p></div><div class="rest"><strong class="sum gain '+(caisse>=0?"pos":"neg")+'">'+money(caisse)+'</strong></div></div></article>'+
    '<dl class="stats"><div><dt>Somme totale d\'achats</dt><dd>'+money(achats)+'</dd></div><div><dt>Paiements achats</dt><dd>'+money(paye)+'</dd></div><div><dt>Reste à payer</dt><dd>'+money(reste)+'</dd></div><div><dt>Ventes encaissées</dt><dd>'+money(s.tot)+'</dd></div></dl>'+
    '<section class="card lots"><div class="lotshead"><h4>Paiements achats</h4><button class="btn small" type="button" data-act="newpay">Ajouter un paiement</button></div>'+rows+'</section>';
}
function openPaiement(){
  openDlg("Paiement d'achats",
    '<label>Montant payé<input name="montant" type="number" min="0.001" step="0.001" inputmode="decimal" required></label>'+
    '<label>Date du paiement<input name="date" type="date" required value="'+todayStr()+'" max="'+todayStr()+'"></label>'+
    '<label>Fournisseur ou note (facultatif)<input name="note" type="text" maxlength="80" autocomplete="off"></label>',
    "Enregistrer le paiement",
    async function(fd){
      var montant=num(fd.get("montant")),ds=String(fd.get("date")||todayStr());
      if(!(montant>0))return "Saisissez un montant supérieur à 0.";

function notify(title,body){
  var LN=nativeLN();
  if(LN){
    try{
      LN.createChannel({id:"stock",name:"Alertes de stock",description:"Ruptures de stock et stocks bas",importance:4,visibility:1,vibration:true}).catch(function(){}).then(function(){
        return LN.schedule({notifications:[{id:Math.floor(Math.random()*2000000000)+1,title:title,body:body,channelId:"stock"}]});
      }).catch(function(){});
    }catch(e){}
    return;
  }
  function fallback(){try{new Notification(title,{body:body,icon:"icon-192.png"})}catch(e){}}
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(function(reg){
        if(reg&&reg.showNotification)reg.showNotification(title,{body:body,icon:"icon-192.png",badge:"icon-192.png",tag:"amana-stock"});
        else fallback();
      }).catch(fallback);
    }else fallback();
  }catch(e){fallback()}

  if(R.alerteSeuil)a.low.forEach(function(p){cur[p.id]="low";if(NOT[p.id]!=="low")fresh.push({p:p,s:"low"})});

    var parts=[];
    if(o.length)parts.push("Rupture de stock : "+o.join(", "));

function notifStatus(){

  if(!("Notification" in window))return "Les notifications ne sont pas disponibles ici.";
  var p=Notification.permission;
  return p==="granted"?"Notifications autorisées sur cet appareil.":p==="denied"?"Notifications bloquées : autorisez-les dans les réglages du téléphone ou du navigateur.":"Notifications pas encore autorisées.";
}
async function askPermission(){
  var LN=nativeLN();
  if(LN){
    try{
      var r=await LN.checkPermissions(),d=r&&r.display;
      if(d!=="granted"){r=await LN.requestPermissions();d=r&&r.display}
      nativePerm=d||"";
      return d==="granted"?"granted":"denied";
    }catch(e){return "denied"}
  }
  if(!("Notification" in window))return "unavailable";
  var p=Notification.permission;
  if(p==="default"){try{p=await Notification.requestPermission()}catch(e){p="denied"}}
  return p;
}

/* ---------- Boîtes de dialogue ---------- */
var dlg=$("#dlg");
function openDlg(title,body,label,onSubmit,opts){
  opts=opts||{};
  dlg.innerHTML='<form class="dform" novalidate><h2>'+esc(title)+"</h2>"+body+
    '<p class="err" role="alert" hidden></p>'+
    '<div class="dactions"><button type="button" class="btn ghost" data-close>Retour</button>'+
    '<button type="submit" class="btn '+(opts.danger?"danger":"primary")+'">'+esc(label)+"</button></div></form>";
  var form=dlg.querySelector("form");
  var err=form.querySelector(".err");
  form.addEventListener("submit",async function(e){
    e.preventDefault();
    if(!form.checkValidity()){form.reportValidity();return}
    err.hidden=true;
    try{
      var r=await onSubmit(new FormData(form));
      if(r){err.textContent=r;err.hidden=false;return}
      dlg.close();
    }catch(ex){
      err.textContent=ex&&ex.code==="invalid_argument"?"Modification refusée : ce compte peut seulement consulter les données.":
        ex&&ex.code==="quota_exceeded"?"Espace de stockage plein. Supprimez d'anciennes opérations.":
        "Enregistrement impossible. Réessayez.";
      err.hidden=false;
    }
  });
  form.querySelector("[data-close]").addEventListener("click",function(){dlg.close()});
  dlg.showModal();
  var f=form.querySelector("input,select");
  if(f&&f.type!=="hidden")f.focus();
  return form;
}
function openConfirm(title,text,label,onOk){
  openDlg(title,"<p>"+esc(text)+"</p>",label,onOk,{danger:true});
}
function typeOptions(sel){
  return Object.keys(TYPES).map(function(k){return '<option value="'+k+'"'+(k===sel?" selected":"")+">"+esc(TYPES[k].label)+"</option>"}).join("");
}

function openSale(preId,old){
  if(!S.produits.length){
    openDlg("Nouvelle vente","<p>Ajoutez d'abord un article au stock.</p>","Ajouter un article",function(){setTimeout(function(){openProduct()},0)});
    return;
  }
  var opts=S.produits.slice().sort(function(a,b){return a.nom.localeCompare(b.nom,"fr",{numeric:true})}).map(function(p){
    return '<option value="'+p.id+'"'+(p.id===preId?" selected":"")+">"+esc(p.nom)+" (restant : "+qty(restant(p))+")</option>";
  }).join("");
  var form=openDlg(old?"Ajouter une ancienne vente":"Nouvelle vente",
    '<label>Article<select name="pid">'+opts+"</select></label>"+
    '<div class="two"><label>Quantité (<span id="uq">rouleau</span>)<input name="q" type="number" min="1" step="1" inputmode="numeric" required value="1"></label>'+
    '<label>Prix unitaire de vente (TTC)<input name="prix" type="number" min="0" step="0.001" inputmode="decimal" required></label></div>'+
    (old?'<label>Prix unitaire d\'achat (TTC)<input name="achat" type="number" min="0" step="0.001" inputmode="decimal" required></label>':"")+
    '<label>Date de la vente<input name="date" type="date" required value="'+todayStr()+'" max="'+todayStr()+'"></label>'+
    '<label class="chk" id="ancLbl" hidden><input type="checkbox" name="ancien"><span>Le stock actuel tient déjà compte de cette vente</span></label>'+
    '<label>Client<input name="client" type="text" maxlength="60" autocomplete="off" list="clientList" required></label><datalist id="clientList">'+clientOptions()+'</datalist>'+
    '<p class="total" id="tot"></p>',
    "Enregistrer la vente",
    async function(fd){
      var p=prod(fd.get("pid"));
      var q=num(fd.get("q")),prix=num(fd.get("prix"));
      if(!p)return "Choisissez un article.";
      if(!String(fd.get("client")||"").trim())return "Saisissez le nom du client.";
      if(!Number.isInteger(q)||q<1)return "La quantité doit être un nombre entier d'au moins 1.";
      if(!(prix>=0))return "Saisissez un prix valide.";
      var ds=String(fd.get("date")||todayStr()),ancien=ds<todayStr()&&!!fd.get("ancien");
      if(ds>todayStr())return "La date ne peut pas être dans le futur.";
      if(!ancien&&q>restant(p))return "Stock insuffisant : il reste "+qty(restant(p))+". Ajoutez d'abord l'arrivage correspondant.";
      var ach=old&&String(fd.get("achat")||"")!==""?num(fd.get("achat")):avgAchat(p);
      if(!(ach>=0))return "Saisissez un prix unitaire d'achat valide.";
      var m={id:uid(),date:dateIso(ds),ancien:ancien,type:"vente",produitId:p.id,nom:p.nom,delta:-q,prix:prix,achat:ach,client:String(fd.get("client")||"").trim()};
      await tx(function(){
        var pp=prod(p.id);pp.vendu=(pp.vendu||0)+q;if(ancien)pp.recu=(pp.recu||0)+q;pp.ca=round3((pp.ca||0)+q*prix);S.mouvements.unshift(m);
      },async function(){await putMvt(m);await saveEtat()});
      
    });
  var sel=form.querySelector("[name=pid]"),inq=form.querySelector("[name=q]"),inp=form.querySelector("[name=prix]");
  function total(){var t=num(inq.value)*num(inp.value);$("#tot").textContent="Total : "+money(isFinite(t)?t:0)}
  function setPrice(){var p=prod(sel.value);if(p)inp.value=p.prix;var uq=form.querySelector("#uq");if(uq)uq.textContent=unitOf(p);var ia=form.querySelector("[name=achat]");if(p&&ia)ia.value=avgAchat(p)>0?round3(avgAchat(p)):"";total()}
  sel.addEventListener("change",setPrice);inq.addEventListener("input",total);inp.addEventListener("input",total);
  var dIn=form.querySelector("[name=date]"),ancLbl=form.querySelector("#ancLbl");
  function toggleAnc(){ancLbl.hidden=!(dIn.value&&dIn.value<todayStr())}
  dIn.addEventListener("input",toggleAnc);dIn.addEventListener("change",toggleAnc);toggleAnc();
  setPrice();
}

function openReception(id){
  var p=prod(id);if(!p)return;
  openDlg("Arrivage : "+p.nom,
    '<p class="hint">Quantité restante actuelle : '+qty(restant(p))+"</p>"+
    '<label>Quantité reçue<input name="q" type="number" min="1" step="1" inputmode="numeric" required></label>'+
    '<label>Prix unitaire d\'achat (TTC)<input name="achat" type="number" min="0" step="0.001" inputmode="decimal" required value="'+(p.achat||"")+'"></label>'+
    '<label>Date d\'arrivage<input name="date" type="date" required value="'+todayStr()+'" max="'+todayStr()+'"></label>',
    "Enregistrer l'arrivage",
    async function(fd){
      var q=num(fd.get("q")),ds=String(fd.get("date")||todayStr()),achat=num(fd.get("achat"));
      if(!Number.isInteger(q)||q<1)return "La quantité doit être un nombre entier d'au moins 1.";
      if(ds>todayStr())return "La date ne peut pas être dans le futur.";
      if(!(achat>=0))return "Saisissez un prix unitaire d'achat valide.";
      var m={id:uid(),date:dateIso(ds),type:"reception",produitId:id,nom:p.nom,delta:q,achat:achat};
      await tx(function(){var pp=prod(id);pp.recu=(pp.recu||0)+q;S.mouvements.unshift(m)},
        async function(){await putMvt(m);await saveEtat()});
    });
}

function openProduct(id){
  var p=id?prod(id):null;
  var form=openDlg(p?"Modifier l'article":"Nouvel article",
    '<label>Type<select name="type">'+typeOptions(p?p.type:"etirable")+"</select></label>"+
    '<label>Désignation<input name="nom" type="text" required maxlength="80" autocomplete="off" value="'+esc(p?p.nom:"")+'" placeholder="'+esc(TYPES[p?p.type:"etirable"].ph)+'"></label>'+
    '<label>Unité de vente<input name="unite" type="text" required maxlength="20" autocomplete="off" value="'+esc(p?unitOf(p):"rouleau")+'"></label>'+
    '<label>Prix unitaire d\'achat (TTC)<input name="achat" type="number" min="0" step="0.001" inputmode="decimal" required value="'+(p&&p.achat?p.achat:"")+'"></label>'+
    '<label>Prix unitaire de vente (TTC)<input name="prix" type="number" min="0" step="0.001" inputmode="decimal" required value="'+(p?p.prix:"")+'"></label>'+
    '<div class="two"><label>'+(p?"Quantité restante":"Quantité en stock au départ")+'<input name="qte" type="number" min="0" step="1" inputmode="numeric" required value="'+(p?restant(p):0)+'"></label>'+
    '<label>Seuil d\'alerte<input name="seuil" type="number" min="0" step="1" inputmode="numeric" required value="'+(p?p.seuil:0)+'"></label></div>'+
    (p?"":'<label>Fournisseur du stock de départ<input name="fournisseur" type="text" maxlength="60" autocomplete="off" list="fournList"></label><datalist id="fournList">'+fournOptions()+'</datalist>')+
    (p?"":'<label>Date d\'arrivage du stock de départ<input name="date" type="date" required value="'+todayStr()+'" max="'+todayStr()+'"></label>')+
    (p?"":'<p class="hint">Pour saisir tout l\'historique des arrivages, mettez 0 ici puis utilisez « Ajouter un arrivage ».</p>')+
    '<p class="hint">Une alerte s\'affiche quand la quantité restante atteint le seuil.</p>'+
    (p?'<button type="button" class="btn danger block" data-del>Supprimer l\'article</button>':""),
    p?"Enregistrer":"Ajouter l'article",
    async function(fd){
      var type=fd.get("type"),nom=String(fd.get("nom")||"").trim();
      var achat=num(fd.get("achat")),prix=num(fd.get("prix")),qte=num(fd.get("qte")),seuil=num(fd.get("seuil"));
      var ds=String(fd.get("date")||todayStr());
      var unite=String(fd.get("unite")||"").trim()||"rouleau";
      if(!nom)return "Saisissez une désignation.";
      if(!(achat>=0))return "Saisissez un prix unitaire d'achat valide.";
      if(!(prix>=0))return "Saisissez un prix unitaire de vente valide.";
      if(!Number.isInteger(qte)||qte<0)return "La quantité doit être un nombre entier, 0 ou plus.";
      if(!Number.isInteger(seuil)||seuil<0)return "Le seuil doit être un nombre entier, 0 ou plus.";
      if(!p&&ds>todayStr())return "La date ne peut pas être dans le futur.";
      var fourn=String(fd.get("fournisseur")||"").trim();
      if(!p&&qte>0&&!fourn)return "Saisissez le fournisseur du stock de départ.";
      if(p){
        var diff=qte-restant(prod(id));
        var m=diff!==0?{id:uid(),date:new Date().toISOString(),type:"ajustement",produitId:id,nom:nom,delta:diff,note:"Correction manuelle du stock"}:null;
        await tx(function(){
          var pp=prod(id);pp.type=type;pp.nom=nom;pp.unite=unite;pp.achat=achat;pp.prix=prix;pp.seuil=seuil;pp.recu=(pp.recu||0)+diff;
          if(m)S.mouvements.unshift(m);
        },async function(){if(m)await putMvt(m);await saveEtat()});
      }else{
        var np={id:uid(),type:type,nom:nom,unite:unite,achat:achat,prix:prix,recu:qte,vendu:0,ca:0,seuil:seuil};
        var m2=qte>0?{id:uid(),date:dateIso(ds),type:"reception",produitId:np.id,nom:nom,delta:qte,achat:achat,fournisseur:fourn,note:"Stock de départ"}:null;
        await tx(function(){S.produits.push(np);if(m2)S.mouvements.unshift(m2)},
          async function(){if(m2)await putMvt(m2);await saveEtat()});
      }
    });
  if(!p){
    var ts=form.querySelector("[name=type]"),ni=form.querySelector("[name=nom]");
    ts.addEventListener("change",function(){ni.placeholder=TYPES[ts.value].ph});
  }
  var del=form.querySelector("[data-del]");
  if(del)del.addEventListener("click",function(){
    dlg.close();
    openConfirm("Supprimer cet article ?","L'article « "+p.nom+" » sera retiré du stock. L'historique des ventes est conservé.","Supprimer",async function(){
      await tx(function(){S.produits=S.produits.filter(function(x){return x.id!==id})},saveEtat);
    });
  });
}

function cancelMvt(id){
  var m=S.mouvements.find(function(x){return x.id===id});
  if(!m)return;
  var isSale=m.type==="vente";
  openConfirm(isSale?"Annuler cette vente ?":"Annuler cet arrivage ?",
    isSale?"Les articles retournent en stock et les sommes de vente sont corrigées.":"La quantité de cet arrivage est retirée du stock.",
    "Oui, annuler",
    async function(){
      var q=Math.abs(m.delta),p=prod(m.produitId);
      if(p&&!isSale&&restant(p)-q<0)return "Impossible : une partie de ce stock est déjà vendue.";
      await tx(function(){
        var pp=prod(m.produitId);
        if(pp){
          if(isSale){pp.vendu=Math.max(0,(pp.vendu||0)-q);if(m.ancien)pp.recu=Math.max(0,(pp.recu||0)-q);pp.ca=Math.max(0,round3((pp.ca||0)-q*m.prix))}
          else{pp.recu=Math.max(0,(pp.recu||0)-q)}
        }
        S.mouvements=S.mouvements.filter(function(x){return x.id!==id});
      },async function(){await delMvt(id);await saveEtat()});
    });
}

/* ---------- Événements ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act],[data-tab],[data-kind],[data-vv],[data-sv]");
  if(!t)return;
  if(t.dataset.tab){setTab(t.dataset.tab);render();return}
  if(t.dataset.kind){sheetKind=t.dataset.kind;histIdx=null;render();return}
  if(t.dataset.vv){venteView=t.dataset.vv;render();return}
  if(t.dataset.sv){stockView=t.dataset.sv;render();return}
  var id=t.dataset.id;
  switch(t.dataset.act){
    case"vendre":openSale(id);break;
    case"reception":openArrival(id);break;
    case"newarrival":openArrival();break;
    case"editsup":openEditSupplier(id);break;
    case"editarr":openEditArrival(id);break;
    case"edit":openProduct(id);break;
    case"annuler":cancelMvt(id);break;
    case"newart":openProduct();break;
    case"newcontact":openContact(t.dataset.ck);break;
    case"editcontact":openContact(t.dataset.ck,id);break;
    case"newsale":openSale();break;
    case"oldsale":openSale(undefined,true);break;
    case"newpay":openPaiement();break;
    case"resetff":ffilt={sup:"",from:"",to:""};render();break;
    case"testnotif":testNotif();break;
    case"annulerpay":cancelPay(id);break;
    case"resetf":filt={pid:"",cli:"",from:"",to:""};render();break;
    case"dladd":curDoc().lines.push({d:"",q:"",u:"",p:""});docSave();render();break;
    case"dlrm":if(curDoc().lines.length>1){curDoc().lines.splice(Number(id),1);docSave();render()}break;
    case"dnew":openDlg("Nouveau document","<p>Effacer les champs de ce document et passer au numéro suivant ?</p>","Confirmer",function(){docNew(sheetKind);render()});break;
    case"print":printSheet();break;
    case"openinv":openInvoice(Number(id));break;
    case"mkinv":{var sm=S.mouvements.find(function(x){return x.id===id&&x.type==="vente"});if(sm){invoiceFromSale(sm);render();window.scrollTo(0,0)}break}
    case"viewinv":{var vi=docLoad().hist.findIndex(function(h){return h.venteId===id});if(vi>=0)openInvoice(vi);break}
    case"histback":histIdx=null;render();window.scrollTo(0,0);break;
    case"histdel":{var hi=Number(id);openConfirm("Supprimer cette facture ?","La facture sera retirée de l'historique. La vente reste enregistrée.","Supprimer",async function(){docLoad().hist.splice(hi,1);docSave();histIdx=null;render()});break}
    case"dlsheet":downloadSheet();break;
  }
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t&&t.dataset&&t.dataset.f&&tab==="factures"){
    docSet(t.dataset.f,t.type==="checkbox"?t.checked:t.value);docDom();docSave();return;
  }
  if(t&&t.dataset&&t.dataset.csearch!==undefined){
    var q=t.value.trim().toLowerCase();
    document.querySelectorAll("details[data-cname]").forEach(function(d){d.hidden=!!q&&d.dataset.cname.indexOf(q)<0});
  }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t&&t.dataset&&t.dataset.f&&tab==="factures"){
    var m=t.dataset.f.match(/^l\.(\d+)\.d$/);
    if(m){
      var l=curDoc().lines[Number(m[1])],pr=docPrice(DK[sheetKind]?sheetKind:"facture",t.value,curDoc());
      if(pr!=null&&l.p===""){
        l.p=String(pr);if(l.q==="")l.q="1";
        var pp=S.produits.find(function(x){return x.nom.trim().toLowerCase()===String(t.value).trim().toLowerCase()});if(pp&&!l.u)l.u=unitOf(pp);var r=t.closest("tr").querySelectorAll("input");
        r[1].value=l.q;r[2].value=l.u||"";r[3].value=l.p;
        docDom();docSave();
      }
    }
    if(t.dataset.f==="paye"){var pv=f3(t.value);t.value=pv;docSet("paye",pv);docDom();docSave()}
    if(t.dataset.f==="party"){var ck=sheetKind==="commande"?"fournisseurs":"clients",sc=findC(ck,t.value);if(sc){var dd=curDoc();[["tel",sc.tel],["mf",sc.mf],["adr",sc.adr]].forEach(function(a){if(a[1]){dd[a[0]]=a[1];var e=document.querySelector('[data-f="'+a[0]+'"]');if(e)e.value=a[1]}});docSave()}}
    if(t.type==="checkbox"){docSet(t.dataset.f,t.checked);docSave()}
    return;
  }
  if(t&&t.dataset&&t.dataset.filter){filt[t.dataset.filter]=t.value;render()}
  if(t&&t.dataset&&t.dataset.set){setReglage(t.dataset.set,t.checked)}
  if(t&&t.dataset&&t.dataset.ffilter){ffilt[t.dataset.ffilter]=t.value;render()}
});
$("#btnSale").addEventListener("click",function(){openSale()});
$("#btnArr").addEventListener("click",function(){openArrival()});
$("#btnBack").addEventListener("click",function(){goBack()});
document.addEventListener("toggle",function(e){var d=e.target;if(d&&d.classList&&d.classList.contains("more-det"))openLots[d.dataset.pid]=d.open},true);


/* ---------- Démarrage ---------- */
async function init(){
  try{var C=window.Capacitor;if(C&&C.Plugins&&C.Plugins.App){C.Plugins.App.addListener("backButton",function(){goBack()})}}catch(e){}
  try{var LN0=nativeLN();if(LN0){LN0.checkPermissions().then(function(r){nativePerm=(r&&r.display)||"";render()}).catch(function(){})}}catch(e){}
  pushGuard();loadReglages();loadNot();tickClock();setInterval(tickClock,15000);
  render();
  var db=null;
  try{
    if(window.claude&&typeof window.claude.use==="function"){
      db=await Promise.race([window.claude.use("db"),new Promise(function(r){setTimeout(function(){r(null)},6000)})]);
    }
  }catch(e){db=null}
  if(db){
    DB=db;
    try{await loadDb()}catch(e){DB=null;loadLocal()}
  }else{loadLocal()}
  ready=true;
  render();
}
init();
})();
</script>
