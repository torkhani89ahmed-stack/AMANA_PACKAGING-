<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMANA PACKAGING — Packaging & Protection Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F9FC; --surface:#FFFFFF; --ink:#112638; --muted:#566B7C; --line:#D9E4EB;
  --film:#17709A; --film-ink:#FFFFFF; --alert:#F2B705; --alert-ink:#3A2C00; --danger:#B3261E;
  --bub-a:#CBEAF7; --bub-b:#3C9DC8; --bub-off:#D3DFE6;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --text:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A24; --surface:#152634; --ink:#E4EEF4; --muted:#93A8B8; --line:#27394A;
    --film:#5BBBE3; --film-ink:#06202D; --danger:#FF8A80;
    --bub-a:#8FD3EE; --bub-b:#2B7FA6; --bub-off:#223647;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A24; --surface:#152634; --ink:#E4EEF4; --muted:#93A8B8; --line:#27394A;
  --film:#5BBBE3; --film-ink:#06202D; --danger:#FF8A80;
  --bub-a:#8FD3EE; --bub-b:#2B7FA6; --bub-off:#223647;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--text);-webkit-text-size-adjust:100%}
.app{max-width:720px;margin:0 auto;padding:0 16px 150px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--film);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:10px;border-bottom:1px solid var(--line)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font:700 30px/1.1 var(--display);letter-spacing:.01em}
.link{background:none;border:0;color:var(--muted);padding:8px 0;min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tabs{display:flex;gap:16px;overflow-x:auto}
.tabs button{white-space:nowrap}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 0 9px;min-height:44px;font:600 18px/1 var(--display);color:var(--muted);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--film)}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 16px;margin:16px 0 8px}
.stats:empty{display:none}
@media (min-width:560px){.stats{grid-template-columns:repeat(3,1fr)}}
.stats dt{font-size:13px;color:var(--muted)}
.stats dd{margin:0;font:700 24px/1.15 var(--display);font-variant-numeric:tabular-nums}
.note{margin:8px 0 0;font-size:14px;color:var(--muted)}

h2{margin:24px 0 10px;font:600 19px/1.2 var(--display);display:flex;gap:10px;align-items:baseline}
h2 span{font:400 14px var(--text);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card.low{border-left:5px solid var(--alert)}
.card.out{border-left:5px solid #D32F2F}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
h3{margin:0;font:700 22px/1.15 var(--display)}
.sub{margin:2px 0 0;font-size:14px;color:var(--muted)}
.rest{text-align:right;flex:none}
.rest strong{display:block;font:700 42px/1 var(--display);font-variant-numeric:tabular-nums}
.rest strong.sum{font-size:28px}
.rest span{font-size:13px;color:var(--muted)}
.status{display:flex;align-items:center;gap:8px;margin:6px 0 0;font-size:14px;font-weight:600}
.led{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none}
.status.ok .led{background:radial-gradient(circle at 35% 30%,#c5f7d8 0 16%,#2fb866 45%,#1c8a47 100%);box-shadow:0 0 0 3px rgba(47,184,102,.28),inset 0 -2px 3px rgba(0,0,0,.25)}
.status.out .led{background:radial-gradient(circle at 35% 30%,#ffc9c4 0 16%,#e5413a 45%,#b3261e 100%);box-shadow:0 0 0 3px rgba(229,65,58,.3),inset 0 -2px 3px rgba(0,0,0,.25)}
.bubbles{display:flex;gap:5px;margin-top:12px}
.bubble{flex:1 1 0;max-width:26px;aspect-ratio:1;border-radius:50%}
.bubble.on{background:radial-gradient(circle at 32% 28%,#fff 0 11%,var(--bub-a) 12% 40%,var(--bub-b) 100%);box-shadow:inset 0 -2px 3px rgba(0,0,0,.2)}
.bubble.off{background:var(--bub-off);box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.low .bubble.on{--bub-a:#FFE08A;--bub-b:#D99A00}
.tag{display:inline-block;margin:12px 0 0;padding:3px 10px;border-radius:99px;background:var(--alert);color:var(--alert-ink);font-size:14px;font-weight:600}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:14px 0 0}
.metrics dt{font-size:13px;color:var(--muted)}
.metrics dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.lots{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.lots h4{margin:0;font:600 14px/1.3 var(--text);color:var(--muted)}
.lotshead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.btn.small{min-height:38px;padding:0 12px;font-size:14px}
.lot{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lot:last-child{border-bottom:0}
.lot small{display:block;font-size:13px;color:var(--muted)}
.lot .q{font-weight:600}
.undo{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:36px;padding:0}
.card .undo.solo{margin-top:6px}
.metrics .wide{grid-column:1/-1}
.gain{font-weight:700}
.gain.pos{color:#1C7A45}
.gain.neg{color:var(--danger)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gain.pos{color:#5FD08A}}
:root[data-theme="dark"] .gain.pos{color:#5FD08A}
.rlt{margin-bottom:4px}
.rl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.rl:last-child{border-bottom:0}
.rl .n{display:flex;align-items:center;gap:8px;min-width:0}
.rl .status{margin:0}
.rl>b{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.rl small{font:400 13px var(--text);color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:14px}
.actions .btn{flex:1;padding-inline:8px}

.btn{min-height:46px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.btn.primary{background:var(--film);border-color:var(--film);color:var(--film-ink)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
:root[data-theme="dark"] .btn.danger{color:#2A0A07}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.danger{color:#2A0A07}}

.empty{margin:32px 0;color:var(--muted)}
.empty .btn{margin-top:12px}
.more{margin:12px 0;color:var(--muted);font-size:14px}
.tagline{margin:0;font-size:14px;color:var(--muted)}
.tabs{gap:6px}
.tabs button{padding:8px 11px 9px;font-weight:700;border-radius:8px 8px 0 0}
.tabs button[aria-current="page"]{background:var(--film);color:var(--film-ink);border-bottom-color:var(--film)}
div.seg button{font-weight:700}
.lot small .undo{min-height:28px;display:inline;font-size:13px;margin-left:6px}
.card .undo.solo{margin-right:16px}
.logo-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 12px;display:flex;justify-content:center;margin-top:16px}
.logo{width:min(260px,100%);height:auto}
.logo-card{padding:0;overflow:hidden;background:#0b0f14;border-color:#0b0f14}
.banner{display:block;width:100%;height:auto}
.welcome{display:block;margin:20px 0 8px;font:700 26px/1.2 var(--display)}
.welcome-p{margin:0;color:var(--muted)}
.btn.wide{width:100%;margin-top:12px}
.clock{margin:2px 0 0;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.clock::first-letter{text-transform:uppercase}
.client{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 14px;margin-bottom:10px}
.client summary{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 0;cursor:pointer;list-style:none}
.client summary::-webkit-details-marker{display:none}
.client summary::after{content:"▾";color:var(--muted)}
.client[open] summary{border-bottom:1px solid var(--line)}
.client .cn{flex:1;min-width:0;font:700 20px/1.2 var(--display)}
.client .cs{text-align:right;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.client .cs b{display:block;color:var(--ink);font-size:16px}
.lot.c2{grid-template-columns:1fr auto}
.alertbar{display:block;width:100%;text-align:left;margin-top:10px;padding:10px 12px;border-radius:8px;border:0;cursor:pointer;font-size:15px;line-height:1.35}
.alertbar.out{background:#D32F2F;color:#fff}
.alertbar.low{background:var(--alert);color:var(--alert-ink)}
.sw{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px;cursor:pointer}
.sw input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--film)}
.sw small{display:block;color:var(--muted);font-size:13px}
.filters{margin-top:14px}
.filters label{display:block;margin:0 0 10px;font-size:14px;color:var(--muted)}
.filters input,.filters select{display:block;width:100%;margin-top:4px;min-height:46px;padding:8px 10px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
@media (max-width:559px){.stats>div:last-child:nth-child(odd){grid-column:1/-1}}

.seg{display:flex;margin:16px 0 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;background:var(--surface);color:var(--muted);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--film);color:var(--film-ink)}
.sheetbar{display:flex;gap:10px;margin:16px 0 12px}
.sheetbar .btn{flex:1}
.sheetwrap{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.sheetwrap .sheet table{min-width:680px}

.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock div{max-width:720px;margin:0 auto;display:flex;gap:10px}
.dock .btn{flex:1}
.dock .primary{flex:1.6}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(460px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(8,18,28,.6)}
.dform{padding:18px}
.dform h2{margin:0 0 12px;font:700 24px/1.15 var(--display);display:block}
.dform label{display:block;margin:0 0 12px;font-size:14px;color:var(--muted)}
.dform input,.dform select{display:block;width:100%;margin-top:4px;min-height:46px;padding:8px 10px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.dform .chk{display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.dform .chk input{width:auto;min-height:0;margin:3px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hint{margin:-4px 0 12px;font-size:14px;color:var(--muted)}
.total{margin:4px 0 12px;font:700 22px/1.2 var(--display)}
.err{margin:0 0 12px;color:var(--danger);font-weight:600}
.dactions{display:flex;gap:10px;margin-top:6px}
.dactions .btn{flex:1}
.dform .btn.danger.block{width:100%;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  html,body{background:#fff}
  :root{padding:0}
  .top,.stats,.note,.dock,.sheetbar,.seg,.alertbar,dialog{display:none!important}
  .app{padding:0;max-width:none}
  .sheetwrap{border:0;overflow:visible}
  .sheetwrap .sheet table{min-width:0}
  .sheet .tw{overflow:visible}
}

/* Navigation du bas */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(8,18,28,.08)}
.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:12px;margin:0 2px;font:600 12px/1 var(--text);position:relative}
.bnav button svg{width:24px;height:24px}
.bnav button[aria-current="page"]{color:var(--film-ink);background:var(--film)}
.bnav button:active{transform:scale(.96)}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:8px;min-height:52px;padding:0 20px 0 16px;border:0;border-radius:99px;background:var(--alert);color:var(--alert-ink);font:700 17px/1 var(--text);cursor:pointer;box-shadow:0 6px 18px rgba(8,18,28,.28)}
.fab:active{transform:scale(.96)}
.top{padding-bottom:6px}
.clientline{margin:6px 0 0;font-size:16px;font-weight:600;color:var(--ink)}
.clientline span{font-weight:400;color:var(--muted)}
@media print{.bnav,.fab{display:none!important}}

/* Menu des onglets en haut */
.bnav{position:static;z-index:auto;box-shadow:none;border-top:0;background:none;padding:8px 0 6px;gap:4px}
.bnav button{min-height:56px;margin:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;gap:4px;font-size:12px}
.bnav button[aria-current="page"]{background:var(--film);border-color:var(--film);color:var(--film-ink)}
.fab{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.app{padding-bottom:100px}
.fab[hidden]{display:none}
.fab2{bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--film);color:var(--film-ink)}
/* ===== Design : Bleu épuré ===== */

<script>
(function(){
"use strict";
var LS_KEY="stock-ventes-emballage-v1";
var TYPES={
  etirable:{label:"Film étirable",ph:"Film étirable transparent 2,3 kg"},
  bulles:{label:"Film à bulles d'air",ph:"Film à bulles d'air 1,2 m × 100 m"}
};
var DB=null, ready=false, tab="accueil", sheetKind="facture", venteView="resume", filt={pid:"",cli:"",from:"",to:""}, stockView="stock", ffilt={sup:"",from:"",to:""};
var S={produits:[],devise:"TND",tva:19,mouvements:[],clients:[],fournisseurs:[],types:[]};
function fixDevise(v){return (v&&String(v).trim())||"TND"}
var BASE_TYPES=null;
function syncTypes(){
  if(!BASE_TYPES)BASE_TYPES={etirable:1,bulles:1};
  Object.keys(TYPES).forEach(function(k){if(!BASE_TYPES[k])delete TYPES[k]});
  (S.types||[]).forEach(function(t){if(t&&t.key&&t.label&&!BASE_TYPES[t.key])TYPES[t.key]={label:t.label,ph:"Désignation de l'article"}});
  (S.produits||[]).forEach(function(p){if(p.type&&!TYPES[p.type])TYPES[p.type]={label:String(p.type),ph:"Désignation de l'article"}});
}

function nextRef(){var m=0;S.produits.forEach(function(p){var n=parseInt(String(p.ref||"").replace(/\D/g,""),10);if(n>m)m=n});return "REF-"+String(m+1).padStart(4,"0")}
var _sm=null,vp={p:"mois",from:"",to:""};
function saleNumOf(x){var n=parseInt(String(x.num||"").split("-").pop(),10);return isNaN(n)?0:n}
function nextSaleNum(){var m=0;S.mouvements.forEach(function(x){if(x.type==="vente"&&saleNumOf(x)>m)m=saleNumOf(x)});return "V-"+new Date().getFullYear()+"-"+String(m+1).padStart(4,"0")}
function backfillSales(){S.mouvements.filter(function(x){return x.type==="vente"&&!x.num}).sort(byDateAsc).forEach(function(x){x.num=nextSaleNum();if(ready)putMvt(x).catch(function(){})})}
function assignRefs(){backfillSales();var ch=false;S.produits.forEach(function(p){if(!p.ref){p.ref=nextRef();ch=true}});if(ch&&ready){saveEtat().catch(function(){})}}
var $=function(s){return document.querySelector(s)};
var esc=function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var nf=new Intl.NumberFormat("fr-FR",{maximumFractionDigits:2});
var nf3=new Intl.NumberFormat("fr-FR",{minimumFractionDigits:3,maximumFractionDigits:3});
var round3=function(n){return Math.round(n*1000)/1000};
var money=function(n){return nf3.format(round3(n||0))+"\u00a0"+esc(S.devise)};
var qty=function(n){return nf.format(n||0)};
var num=function(v){return Number(String(v).replace(",","."))};
var uid=function(){return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
var todayStr=function(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
var dateIso=function(ds){return ds===todayStr()?new Date().toISOString():new Date(ds+"T12:00:00").toISOString()};
var fmtDate=function(iso){return new Date(iso).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"})};
var byDateDesc=function(a,b){return a.date<b.date?1:a.date>b.date?-1:0};
var byDateAsc=function(a,b){return a.date<b.date?-1:a.date>b.date?1:0};
var prod=function(id){return S.produits.find(function(p){return p.id===id})};
var restant=function(p){return (p.recu||0)-(p.vendu||0)-(p.sorti||0)};
var isLow=function(p){var r=restant(p);return r<=0||(p.seuil>0&&r<=p.seuil)};
var lotPrice=function(x,p){return x.achat!=null?x.achat:((p&&p.achat)||0)};
var avgAchat=function(p){
  var q=0,c=0;
  S.mouvements.forEach(function(x){if(x.type==="reception"&&x.produitId===p.id){q+=x.delta;c+=x.delta*lotPrice(x,p)}});
  return q>0?c/q:(p.achat||0);
};
var priceNote=function(p){
  var set={};
  S.mouvements.forEach(function(x){if(x.type==="reception"&&x.produitId===p.id)set[lotPrice(x,p)]=1});
  return Object.keys(set).length>1?" (moyen)":"";
};
var achatOf=function(x){var p=prod(x.produitId);return x.achat!=null?x.achat:(p?avgAchat(p):0)};
var sortedByType=function(k){return S.produits.filter(function(p){return p.type===k&&!p.archive}).sort(function(a,b){return a.nom.localeCompare(b.nom,"fr",{numeric:true})})};
var ventesList=function(){return S.mouvements.filter(function(x){return x.type==="vente"})};
var unitOf=function(p){return (p&&p.unite)||"rouleau"};
var findC=function(kind,name){var k=String(name||"").trim().toLowerCase();return (S[kind]||[]).find(function(c){return String(c.nom||"").trim().toLowerCase()===k})||null};
var ctTel=function(kind,name){var c=findC(kind,name);return c?[c.tel,c.mf?"M.F "+c.mf:""].filter(Boolean).join(" / "):""};
var unitLbl=function(p,n){var u=unitOf(p);if(Math.abs(n)>=2){if(/(eau|au)$/i.test(u))return u+"x";if(/[sxz]$/i.test(u))return u;return u+"s"}return u};

/* ---------- Persistance ---------- */
function loadLocal(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(raw){var o=JSON.parse(raw);S={produits:o.produits||[],devise:fixDevise(o.devise),tva:(o.tva!=null&&!isNaN(Number(o.tva))?Number(o.tva):19),mouvements:o.mouvements||[],clients:o.clients||[],fournisseurs:o.fournisseurs||[],types:o.types||[]}}
  }catch(e){}
}
var saveErr=false;
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){saveErr=true}}
async function saveEtat(){
  if(DB){await DB.doc("stock/etat").set({produits:S.produits,devise:S.devise,tva:S.tva,clients:S.clients||[],fournisseurs:S.fournisseurs||[],types:S.types||[]})}else{saveLocal()}
}
async function putMvt(m){
  if(DB){await DB.doc("mouvements/"+m.id).set(m)}else{saveLocal()}
}
async function delMvt(id){
  if(DB){await DB.doc("mouvements/"+id).delete()}else{saveLocal()}
}
async function loadDb(){
  var d=await DB.doc("stock/etat").get();
  if(d.exists){
    var o=d.data();
    S.produits=Array.isArray(o.produits)?o.produits.map(function(x){return Object.assign({},x)}):[];
    S.devise=fixDevise(o.devise);S.tva=(o.tva!=null&&!isNaN(Number(o.tva))?Number(o.tva):19);

function gauge(p){
  var r=restant(p);
  var ref=p.seuil>0?p.seuil*4:Math.max(r,10);
  var on=Math.round(Math.min(Math.max(r,0)/ref,1)*12);
  if(r>0&&on===0)on=1;
  var h="";
  for(var i=0;i<12;i++)h+='<span class="bubble '+(i<on?"on":"off")+'"></span>';
  return '<div class="bubbles" aria-hidden="true">'+h+"</div>";
}

function invSave(){

  });

  if(bad)return info("Inventaire","Certaines quantités ne sont pas valides : saisissez un nombre entier, 0 ou plus.");
  if(!filled)return info("Inventaire","Saisissez au moins une quantité comptée.");
  if(!diffs.length){invCounts={};render();return info("Inventaire","Aucun écart : le stock du système correspond à votre comptage.")}
  openDlg("Enregistrer l'inventaire ?",
    '<p>'+plural(diffs.length,"produit sera corrigé","produits seront corrigés")+' :</p><ul class="invlist">'+diffs.map(function(x){return '<li><b>'+esc(x.p.nom)+'</b> : '+qty(restant(x.p))+' → '+qty(x.c)+' ('+(x.d>0?"+":"−")+qty(Math.abs(x.d))+')<label>Motif de la correction<input name="mo_'+x.p.id+'" type="text" required maxlength="80" autocomplete="off" placeholder="Ex. : erreur de saisie, casse constatée"></label></li>'}).join("")+'</ul>',
    "Enregistrer",

      await tx(function(){diffs.forEach(function(x){var pp=prod(x.p.id);if(pp)pp.recu=(pp.recu||0)+x.d});S.mouvements=ms.concat(S.mouvements)},

    });
}

/* ---------- Onglet Vente ---------- */
function stats(){
  var now=new Date();
  var d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).toISOString();
  var m0=new Date(now.getFullYear(),now.getMonth(),1).toISOString();
  var j=0,m=0,tot=0,va=0,vv=0,rest=0,gain=0,ach=0;
  ventesList().forEach(function(x){
    var t=-x.delta*x.prix;
    tot+=t;ach+=(-x.delta)*achatOf(x);gain=tot-ach;
    if(x.date>=m0)m+=t;
    if(x.date>=d0)j+=t;
  });
  S.produits.forEach(function(p){
    if(p.archive)return;var r=Math.max(0,restant(p));
    va+=r*avgAchat(p);vv+=r*p.prix;rest+=r;
  });
  return {j:j,m:m,tot:tot,ach:ach,gain:gain,va:va,vv:vv,rest:rest};
}
function vpRange(){
  var n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),a,b="9999-12-31T23:59:59.999Z";
  if(vp.p==="jour")a=d0;else if(vp.p==="semaine"){a=new Date(d0);a.setDate(a.getDate()-((a.getDay()+6)%7))}else if(vp.p==="mois")a=new Date(n.getFullYear(),n.getMonth(),1);
  else{a=vp.from?new Date(vp.from+"T00:00:00"):new Date(0);if(vp.to)b=new Date(vp.to+"T23:59:59").toISOString()}
  return [a.toISOString(),b];
}
function periodBar(){
  var it=[["jour","Jour"],["semaine","Semaine"],["mois","Mois"],["perso","Période"]];
  return '<div class="seg" role="group" aria-label="Période">'+it.map(function(i){return '<button type="button" data-act="vper" data-id="'+i[0]+'" aria-pressed="'+(vp.p===i[0])+'">'+i[1]+'</button>'}).join("")+'</div>'+
    (vp.p==="perso"?'<div class="filters"><div class="two"><label>Du<input type="date" data-vp="from" value="'+esc(vp.from)+'"></label><label>Au<input type="date" data-vp="to" value="'+esc(vp.to)+'"></label></div></div>':'');
}
function statsHtml(){
  var s=stats(),r=vpRange(),ca=0,nb=0,enc=0,due=0;
  ventesList().forEach(function(x){if(x.date>=r[0]&&x.date<=r[1]){ca+=Math.abs(x.delta)*x.prix;nb++}});
  S.mouvements.forEach(function(x){if(x.type==="encaissement"&&x.date>=r[0]&&x.date<=r[1])enc+=x.montant||0});
  var sm=saleStatusMap();Object.keys(sm).forEach(function(k){due+=sm[k].reste});
  var c=function(l,v){return "<div><dt>"+l+"</dt><dd>"+v+"</dd></div>"};
  return c("CA de la période (TTC)",money(ca))+c("Nombre de ventes",qty(nb))+c("Encaissé sur la période",money(enc))+c("Reste à encaisser (total)",money(due))+c("Ventes du jour",money(s.j))+c("Ventes du mois",money(s.m))+c("Somme d'achat (TTC)",money(s.ach))+c("Gain total",money(s.gain));
}

  return ventesList().filter(function(x){
    if(filt.pid&&x.produitId!==filt.pid)return false;
    if(filt.q&&(String(x.num||"")+" "+String(x.client||"")+" "+String(x.nom||"")).toLowerCase().indexOf(String(filt.q).trim().toLowerCase())<0)return false;
    if(filt.st){var s0=saleStatusMap()[x.id];if(!s0||s0.st!==filt.st)return false}

function ckey(n){return String(n||"").trim().toLowerCase()||"sans client"}
function saleStatusMap(){
  if(_sm)return _sm;
  var paid={},map={};
  S.mouvements.forEach(function(e){if(e.type==="encaissement")paid[ckey(e.client)]=(paid[ckey(e.client)]||0)+(e.montant||0)});
  ventesList().sort(byDateAsc).forEach(function(x){var k=ckey(x.client),t=round3(Math.abs(x.delta)*x.prix),a=Math.min(Math.max(paid[k]||0,0),t);paid[k]=(paid[k]||0)-a;var r=round3(t-a);map[x.id]={total:t,paye:round3(a),reste:r,st:r<=0.0005?"pay":a>0.0005?"part":"non"}});

}

  });
  h+='<h2>Détail par article</h2><div class="tw"><table><thead><tr><th class="l">Article</th><th>Stock initial</th><th>Quantité vendue</th><th>Quantité restante</th></tr></thead><tbody>'+rows+

function bilanGeneralInner(){
  var ventes=ventesList(),tq=0,ts=0,ta=0,by={};
  ventes.forEach(function(x){
    var q=Math.abs(x.delta),pa=achatOf(x);
    tq+=q;ts+=q*x.prix;ta+=q*pa;
    var k=x.produitId||x.nom;
    if(!by[k])by[k]={s:0,a:0};
    by[k].s+=q*x.prix;by[k].a+=q*pa;
  });
  var st={n:S.produits.length,init:0,vendu:0,rest:0,out:0};
  S.produits.forEach(function(p){var r=restant(p);st.init+=p.recu||0;st.vendu+=p.vendu||0;st.rest+=r;if(r<=0)st.out++});
  var dates=ventes.map(function(x){return x.date}).sort();
  var per=dates.length?fmtDate(dates[0])+" au "+fmtDate(dates[dates.length-1]):"—";
  function dl(list){return '<dl class="sum">'+list.map(function(x){return '<div'+(x[2]?' class="tot"':'')+'><dt>'+esc(x[0])+'</dt><dd>'+x[1]+'</dd></div>'}).join("")+'</dl>'}
  var h='<p class="co">AMANA PACKAGING</p><h1>Bilan général</h1><p class="date">Situation au '+esc(nowLabel())+'</p>';

      addInvPay(x,{id:uid(),date:ds,montant:round3(m),mode:String(fd.get("mode")||""),ref:String(fd.get("ref")||"").trim()});
      docSave();render();
    });
}
function cancelInvPay(key){
  var a=String(key).split(":"),x=DOC.hist[Number(a[0])];if(!x)return;

    var p=invPays(x).find(function(q){return q.id===a[1]});if(!p)return;
    p.annule=true;if(p.enc){var ei=p.enc;S.mouvements=S.mouvements.filter(function(m){return m.id!==ei});delMvt(ei).catch(function(){});p.enc=null}var s=invPaid(x);x.paye=s>0?s.toFixed(3):"";

  });
}
function cancelInvoice(){

function issueInvoice(){
  var D=docLoad(),d=D.facture,info=function(m){openDlg("Émettre la facture","<p>"+m+"</p>","Fermer",function(){})};
  if(!String(d.party||"").trim())return info("Saisissez le client avant d'émettre la facture.");
  var ok=d.lines.filter(function(l){return l.d&&num(l.q)>0&&l.p!==""&&num(l.p)>=0});
  if(!ok.length)return info("Ajoutez au moins une ligne complète (désignation, quantité, prix).");
  openDlg("Émettre la facture ?","<p>La facture "+esc(d.num)+" sera ajoutée à la liste. Elle ne pourra plus être modifiée sans correction contrôlée.</p>","Émettre",async function(){
    var c=JSON.parse(JSON.stringify(d));c.lines=JSON.parse(JSON.stringify(ok));
    if(D.hist.some(function(h){return h.num===c.num}))c.num=nextInvNum();
    c.statut="emise";c.emis=todayStr();var p0=num(c.paye)||0;
    c.paiements=p0>0?[{id:uid(),date:c.date||todayStr(),montant:round3(p0),mode:"",ref:""}]:[];c.paye=p0>0?p0.toFixed(3):"";c.log=[{date:new Date().toISOString(),txt:"Facture émise"}];

  });
}
function devisToInvoice(){

function invRange(){
  var n=new Date(),t=todayStr(),a="",b="9999-12-31";
  if(hv.p==="jour"){a=b=t}
  else if(hv.p==="semaine"){var d=new Date(n.getFullYear(),n.getMonth(),n.getDate());d.setDate(d.getDate()-((d.getDay()+6)%7));a=isoToDs(d.toISOString())}
  else if(hv.p==="mois"){a=t.slice(0,8)+"01"}
  else if(hv.p==="perso"){a=hv.from||"";b=hv.to||b}
  return [a,b];
}
function invList(){
  var D=docLoad(),r=invRange();
  return D.hist.map(function(x,i){return {x:x,i:i}}).filter(function(o){var d=o.x.date||"";return d>=r[0]&&d<=r[1]});
}

function viewBilan(){
  var s=stats(),achats=0,paye=0;
  S.produits.forEach(function(p){achats+=(p.recu||0)*avgAchat(p)});
  var pays=S.mouvements.filter(function(x){return x.type==="paiement"}).sort(byDateDesc);
  pays.forEach(function(x){paye+=x.montant||0});
  var caisse=s.tot-paye,reste=achats-paye;
  var rows=pays.length?pays.map(function(x){
    return '<div class="lot"><div>'+fmtDate(x.date)+(x.note?'<small>'+esc(x.note)+'</small>':'')+'</div><div class="q">'+money(x.montant)+'</div><button class="undo" type="button" data-act="annulerpay" data-id="'+x.id+'">Annuler</button></div>';
  }).join(""):'<p class="sub">Aucun paiement enregistré.</p>';
  return '<article class="card"><div class="head"><div><h3>Caisse</h3><p class="sub">Ventes encaissées moins paiements achats</p></div><div class="rest"><strong class="sum gain '+(caisse>=0?"pos":"neg")+'">'+money(caisse)+'</strong></div></div></article>'+
    '<dl class="stats"><div><dt>Somme totale d\'achats</dt><dd>'+money(achats)+'</dd></div><div><dt>Paiements achats</dt><dd>'+money(paye)+'</dd></div><div><dt>Reste à payer</dt><dd>'+money(reste)+'</dd></div><div><dt>Ventes encaissées</dt><dd>'+money(s.tot)+'</dd></div></dl>'+
    '<section class="card lots"><div class="lotshead"><h4>Paiements achats</h4><button class="btn small" type="button" data-act="newpay">Ajouter un paiement</button></div>'+rows+'</section>';
}
function openPaiement(){
  openDlg("Paiement d'achats",
    '<label>Montant payé<input name="montant" type="number" min="0.001" step="0.001" inputmode="decimal" required></label>'+
    '<label>Date du paiement<input name="date" type="date" required value="'+todayStr()+'" max="'+todayStr()+'"></label>'+
    '<label>Fournisseur ou note (facultatif)<input name="note" type="text" maxlength="80" autocomplete="off"></label>',
    "Enregistrer le paiement",
    async function(fd){
      var montant=num(fd.get("montant")),ds=String(fd.get("date")||todayStr());
      if(!(montant>0))return "Saisissez un montant supérieur à 0.";

      navigator.serviceWorker.getRegistration().then(function(reg){
        if(reg&&reg.showNotification)reg.showNotification(title,{body:body,icon:"icon-192.png",badge:"icon-192.png",tag:"amana-stock"});

function dsStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function apRange(p){

  if(p==="semaine"){a=new Date(d0);a.setDate(a.getDate()-((a.getDay()+6)%7));b=new Date(a.getTime());b.setDate(b.getDate()+7);b=new Date(b.getTime()-1)}

function payToIso(ds){return new Date((ds||todayStr())+"T12:00:00").toISOString()}
function finance(a,b){
  var A=a.toISOString(),B=b.toISOString(),t=tvaRate(),r={ca:0,n:0,cout:0,enc:0};
  ventesList().forEach(function(x){if(x.date>=A&&x.date<=B){var q=Math.abs(x.delta);r.ca+=q*x.prix;r.n++;r.cout+=q*achatOf(x)}});
  S.mouvements.forEach(function(x){if(x.type==="encaissement"&&x.date>=A&&x.date<=B)r.enc+=x.montant||0});
  docLoad().hist.forEach(function(x){if(x.statut==="annulee"||x.venteId)return;invPays(x).forEach(function(p){var d=payToIso(p.date);if(!p.annule&&d>=A&&d<=B)r.enc+=p.montant||0})});
  r.ht=r.ca/(1+t/100);r.coutHt=r.cout/(1+t/100);r.marge=r.ht-r.coutHt;

}
function resteTotal(){

function buckets(){
  var r=apRange(),a=r[0],b=r[1],out=[],idx={},ds=function(d){return isoToDs(d.toISOString())};
  if(ap.p==="jour"){for(var h=0;h<24;h++){idx["h"+h]=out.length;out.push({l:String(h),t:h+" h",v:0})}}
  else if(ap.p==="perso"&&(b-a)/864e5>62){var d=new Date(a.getFullYear(),a.getMonth(),1);while(d<=b){var k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");idx[k]=out.length;out.push({l:String(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2),t:k,v:0});d=new Date(d.getFullYear(),d.getMonth()+1,1)}}
  else{var d2=new Date(a);while(d2<=b){var k2=ds(d2);idx[k2]=out.length;out.push({l:ap.p==="semaine"?["L","M","M","J","V","S","D"][(d2.getDay()+6)%7]:String(d2.getDate()),t:fmtDate(d2.toISOString()),v:0});d2.setDate(d2.getDate()+1)}}
  ventesList().forEach(function(x){
    var d=new Date(x.date);if(d<a||d>b)return;
    var k=ap.p==="jour"?"h"+d.getHours():(ap.p==="perso"&&(b-a)/864e5>62)?d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"):ds(d);

}

function openDlg(title,body,label,onSubmit,opts){

    '<p class="err" role="alert" hidden></p>'+
    '<div class="dactions"><button type="button" class="btn ghost" data-close>Retour</button>'+

    try{
      var r=await onSubmit(new FormData(form));
      if(r){err.textContent=r;err.hidden=false;return}
      dlg.close();
    }catch(ex){
      err.textContent=ex&&ex.code==="invalid_argument"?"Modification refusée : ce compte peut seulement consulter les données.":

  form.querySelector("[data-close]").addEventListener("click",function(){dlg.close()});
  dlg.showModal();

  if(f&&f.type!=="hidden")f.focus();

function cancelMvt(id){
  var m=S.mouvements.find(function(x){return x.id===id});
  if(!m)return;
  var isSale=m.type==="vente",isExit=m.type==="sortie";
  openConfirm(isSale?"Annuler cette vente ?":isExit?"Annuler cette sortie ?":"Annuler cet arrivage ?",
    isSale?"Les articles retournent en stock et les sommes de vente sont corrigées.":isExit?"Les quantités de cette sortie retournent en stock.":"La quantité de cet arrivage est retirée du stock.",
    "Oui, annuler",
    async function(){
      var q=Math.abs(m.delta),p=prod(m.produitId);
      if(p&&!isSale&&!isExit&&restant(p)-q<0)return "Impossible : une partie de ce stock est déjà vendue.";
      await tx(function(){
        var pp=prod(m.produitId);
        if(pp){
          if(isSale){pp.vendu=Math.max(0,(pp.vendu||0)-q);if(m.ancien)pp.recu=Math.max(0,(pp.recu||0)-q);pp.ca=Math.max(0,round3((pp.ca||0)-q*m.prix))}
          else if(isExit){pp.sorti=Math.max(0,(pp.sorti||0)-q)}
          else{pp.recu=Math.max(0,(pp.recu||0)-q)}
        }
        S.mouvements=S.mouvements.filter(function(x){return x.id!==id});
      },async function(){await delMvt(id);await saveEtat()});
    });
}

document.addEventListener("toggle",function(e){var d=e.target;if(d&&d.classList&&d.classList.contains("more-det"))openLots[d.dataset.pid]=d.open},true);


/* ---------- Ajouts : TVA, paiements clients, créances, impayées, paramètres ---------- */
function tvaRate(){var t=Number(S.tva);return isNaN(t)||t<0?19:t}
function docRate(d){var r=Number(String(d&&d.tva!=null?d.tva:"").replace(",","."));return (isNaN(r)||String(d&&d.tva).trim()==="")?tvaRate():r}
function clientBalances(){
  var map={};
  var get=function(n){var raw=String(n||"").trim(),name=raw||"Sans client",k=name.toLowerCase();if(!map[k])map[k]={nom:name,ventes:0,paye:0,nb:0};return map[k]};
  ventesList().forEach(function(x){var c=get(x.client);c.ventes+=Math.abs(x.delta)*x.prix;c.nb++});
  S.mouvements.forEach(function(x){if(x.type==="encaissement")get(x.client).paye+=x.montant||0});
  (S.clients||[]).forEach(function(c){if(c.nom)get(c.nom)});
  return Object.keys(map).map(function(k){var c=map[k];c.reste=round3(c.ventes-c.paye);return c});
}
function viewCreances(){
  var list=clientBalances().filter(function(c){return c.reste>0.0005}).sort(function(a,b){return b.reste-a.reste});
  var tot=0;list.forEach(function(c){tot+=c.reste});
  var rows=list.map(function(c){
    return '<article class="card"><div class="head"><div><h3>'+esc(c.nom)+'</h3><p class="sub">Ventes : '+money(c.ventes)+' · Payé : '+money(c.paye)+'</p></div><div class="rest"><strong class="sum">'+money(c.reste)+'</strong><span>Reste à payer</span></div></div>'+
      '<div class="actions"><button class="btn primary" type="button" data-act="newpayc" data-id="'+esc(c.nom)+'">Encaisser un paiement</button></div></article>';
  }).join("");
  return '<dl class="stats"><div><dt>Clients débiteurs</dt><dd>'+list.length+'</dd></div><div><dt>Total des créances</dt><dd>'+money(tot)+'</dd></div></dl>'+
    (rows||'<div class="empty"><p>Aucune créance : tous les clients sont à jour.</p></div>');
}
function viewPaiements(){
  var list=S.mouvements.filter(function(x){return x.type==="encaissement"}).sort(byDateDesc),tot=0;
  list.forEach(function(x){tot+=x.montant||0});
  var rows=list.slice(0,300).map(function(x){
    return '<article class="card"><div class="head"><div><h3>'+esc(x.client)+'</h3><p class="sub">'+fmtDate(x.date)+(x.mode?' · '+esc(x.mode):'')+'</p>'+(x.note?'<p class="sub">'+esc(x.note)+'</p>':'')+'</div><div class="rest"><strong class="sum">'+money(x.montant)+'</strong><span>Encaissé</span></div></div>'+
      '<button class="undo solo" type="button" data-act="annulerenc" data-id="'+x.id+'">Annuler ce paiement</button></article>';
  }).join("");
  return '<button class="btn primary wide" type="button" data-act="newpayc">Enregistrer un paiement client</button>'+
    '<dl class="stats"><div><dt>Paiements</dt><dd>'+qty(list.length)+'</dd></div><div><dt>Total encaissé</dt><dd>'+money(tot)+'</dd></div></dl>'+
    (rows||'<div class="empty"><p>Aucun paiement client enregistré.</p></div>');
}
function openEncaissement(name){
  var b=name?clientBalances().find(function(c){return c.nom.toLowerCase()===String(name).toLowerCase()}):null;
  openDlg("Paiement client",
    '<label>Client<input name="client" type="text" required maxlength="60" autocomplete="off" list="clientList" value="'+esc(name||"")+'"></label><datalist id="clientList">'+clientOptions()+'</datalist>'+
    (b?'<p class="hint">Reste à payer : '+money(b.reste)+'</p>':'')+
    '<div class="two"><label>Montant encaissé<input name="montant" type="number" min="0.001" step="0.001" inputmode="decimal" required value="'+(b&&b.reste>0?round3(b.reste):"")+'"></label>'+
    '<label>Mode<select name="mode"><option>Espèces</option><option>Virement</option><option>Chèque</option><option>Effet</option><option>Autre</option></select></label></div>'+
    '<label>Date<input name="date" type="date" required value="'+todayStr()+'" max="'+todayStr()+'"></label>'+
    '<label>Note (facultatif)<input name="note" type="text" maxlength="80" autocomplete="off"></label>',
    "Enregistrer le paiement",
    async function(fd){
      var cl=String(fd.get("client")||"").trim(),montant=num(fd.get("montant")),ds=String(fd.get("date")||todayStr());
      if(!cl)return "Saisissez le nom du client.";
      if(!(montant>0))return "Saisissez un montant supérieur à 0.";
      if(ds>todayStr())return "La date ne peut pas être dans le futur.";
      var m={id:uid(),date:dateIso(ds),type:"encaissement",client:cl,montant:round3(montant),mode:String(fd.get("mode")||""),note:String(fd.get("note")||"").trim()};
      await tx(function(){S.mouvements.unshift(m)},async function(){await putMvt(m)});
    });
}
function cancelEnc(id){
  openConfirm("Annuler ce paiement ?","Le montant sera de nouveau compté comme impayé.","Oui, annuler",async function(){
    await tx(function(){S.mouvements=S.mouvements.filter(function(x){return x.id!==id})},async function(){await delMvt(id)});
  });
}
function impayesView(){
  var D=docLoad(),rows=[],tot=0;
  D.hist.forEach(function(x,i){if(x.statut==="annulee")return;var t=docCalc(x).ttc,r=round3(t-(num(x.paye)||0));if(r>0.0005){tot+=r;rows.push({x:x,i:i,t:t,r:r})}});
  var h='<dl class="stats"><div><dt>Factures impayées</dt><dd>'+rows.length+'</dd></div><div><dt>Total à encaisser</dt><dd>'+fm(tot)+'</dd></div></dl>';
  if(!rows.length)return h+'<div class="empty"><p>Aucune facture impayée.</p></div>';
  return h+rows.map(function(o){
    var x=o.x;
    return '<article class="card"><div class="head"><div><h3>'+esc(x.num)+'</h3><p class="sub">'+esc(x.party||"Client non renseigné")+'</p><p class="sub">'+(x.date?fmtDate(x.date+"T12:00:00"):"")+(x.ech?' · Échéance : '+esc(x.ech):'')+'</p></div><div class="rest"><strong class="sum">'+fm(o.r)+'</strong><span>Reste à payer</span></div></div>'+
      '<dl class="metrics"><div><dt>Total TTC</dt><dd>'+fm(o.t)+'</dd></div><div><dt>Déjà payé</dt><dd>'+fm(num(x.paye)||0)+'</dd></div></dl>'+
      '<div class="actions"><button class="btn" type="button" data-act="openinv" data-id="'+o.i+'">Ouvrir</button><button class="btn primary" type="button" data-act="markpaid" data-id="'+o.i+'">Marquer payée</button></div></article>';
  }).join("");
}
function markPaid(i){
  var D=docLoad(),x=D.hist[i];if(!x)return;
  openConfirm("Marquer comme payée ?","La facture "+x.num+" sera considérée comme entièrement payée.","Confirmer",async function(){
    var rs=round3(invTtc(x)-invPaid(x));if(rs>0)addInvPay(x,{id:uid(),date:todayStr(),montant:rs,mode:"",ref:"Solde"});docSave();render();
  });
}
function applyTheme(){
  var dark=R.theme==="dark"||(R.theme==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme",dark?"dark":"light");
  document.documentElement.setAttribute("data-fs",R.taille==="grand"?"large":"normal");
}
function displayHtml(){
  var seg=function(k,items){return '<div class="seg" role="group">'+items.map(function(i){return '<button type="button" data-act="setopt" data-id="'+k+':'+i[0]+'" aria-pressed="'+(R[k]===i[0])+'">'+i[1]+'</button>'}).join("")+'</div>'};
  return '<article class="card"><h3>Affichage</h3>'+
    '<p class="sub">Thème</p>'+seg("theme",[["auto","Automatique"],["light","Clair"],["dark","Sombre"]])+
    '<p class="sub" style="margin-top:14px">Taille du texte</p>'+seg("taille",[["normal","Normale"],["grand","Grande"]])+
    '<p class="sub" style="margin-top:10px">Automatique suit le réglage sombre ou clair de votre téléphone.</p></article>';
}
function settingsHtml(){
  var D=docLoad(),co=D.co;
  var ln=function(a,b){return '<p class="sub">'+esc(a)+' : '+esc(b||"non renseigné")+'</p>'};
  return '<article class="card"><h3>Informations société</h3>'+ln("Raison sociale",co.nom||"AMANA PACKAGING")+ln("Adresse",co.adr||"Tunis, Tunisie")+ln("Téléphone",co.tel)+ln("Matricule fiscal",co.mf)+ln("E-mail",co.email)+
      '<div class="actions"><button class="btn" type="button" data-act="setco">Modifier</button></div></article>'+
    '<article class="card"><h3>TVA et devise</h3>'+ln("TVA",nf.format(tvaRate())+" %")+ln("Devise",S.devise)+
      '<div class="actions"><button class="btn" type="button" data-act="setvat">Modifier</button></div></article>'+
    '<article class="card"><h3>Gestion des numéros</h3>'+["facture","devis","commande"].map(function(k){return ln(DK[k].nl,D[k].num)}).join("")+
      '<div class="actions"><button class="btn" type="button" data-act="setnum">Modifier</button></div></article>'+
    '<article class="card"><h3>Sauvegarde des données</h3><p class="sub">Exportez toutes vos données (stock, ventes, paiements, factures, société) dans un fichier, ou restaurez-les depuis une sauvegarde.</p>'+
      '<div class="actions"><button class="btn primary" type="button" data-act="expdata">Exporter</button><button class="btn" type="button" data-act="impdata">Importer</button></div>'+
      '<input type="file" id="impFile" accept="application/json,.json" hidden></article>';
}
function openCompany(){
  var co=docLoad().co;
  openDlg("Informations société",
    '<label>Raison sociale<input name="nom" type="text" maxlength="60" autocomplete="off" value="'+esc(co.nom||"AMANA PACKAGING")+'"></label>'+
    '<label>Adresse<input name="adr" type="text" maxlength="120" autocomplete="off" value="'+esc(co.adr||"Tunis, Tunisie")+'"></label>'+
    '<label>Téléphone<input name="tel" type="tel" maxlength="30" autocomplete="off" value="'+esc(co.tel||"")+'"></label>'+
    '<label>Matricule fiscal<input name="mf" type="text" maxlength="30" autocomplete="off" value="'+esc(co.mf||"")+'"></label>'+
    '<label>E-mail<input name="email" type="email" maxlength="80" autocomplete="off" value="'+esc(co.email||"")+'"></label>',
    "Enregistrer",
    async function(fd){
      var c=docLoad().co;
      ["nom","adr","tel","mf","email"].forEach(function(k){c[k]=String(fd.get(k)||"").trim()});
      docSave();render();
    });
}
function openVat(){
  var devs=["TND","EUR","USD","MAD","DZD"];if(devs.indexOf(S.devise)<0)devs.unshift(S.devise);
  openDlg("TVA et devise",
    '<label>Taux de TVA (%)<input name="tva" type="number" min="0" max="100" step="0.01" inputmode="decimal" required value="'+tvaRate()+'"></label>'+
    '<label>Devise<select name="devise">'+devs.map(function(d){return '<option'+(d===S.devise?" selected":"")+'>'+esc(d)+'</option>'}).join("")+'</select></label>'+
    '<p class="hint">Le nouveau taux s\'applique aux nouveaux documents et aux brouillons en cours. Les factures déjà dans l\'historique gardent leur taux.</p>',
    "Enregistrer",
    async function(fd){
      var t=num(fd.get("tva")),d=String(fd.get("devise")||"TND");
      if(!(t>=0&&t<=100))return "Saisissez un taux de TVA entre 0 et 100.";
      await tx(function(){S.tva=t;S.devise=d},saveEtat);
      var D=docLoad();["facture","devis","commande"].forEach(function(k){D[k].tva=String(t)});docSave();
    });
}
function openNumbers(){
  var D=docLoad();
  openDlg("Numéros de documents",
    '<p class="hint">Saisissez le prochain numéro à utiliser. Les suivants augmentent automatiquement.</p>'+
    ["facture","devis","commande"].map(function(k){return '<label>'+esc(DK[k].nl)+'<input name="'+k+'" type="text" required maxlength="30" autocomplete="off" value="'+esc(D[k].num)+'"></label>'}).join(""),
    "Enregistrer",
    async function(fd){
      var v={};
      for(var i=0,ks=["facture","devis","commande"];i<ks.length;i++){
        v[ks[i]]=String(fd.get(ks[i])||"").trim();
        if(!v[ks[i]])return "Saisissez tous les numéros.";
        if(!/\d+$/.test(v[ks[i]]))return "Chaque numéro doit se terminer par un chiffre (ex. FAC-2026-001).";
      }
      if(v.facture!==D.facture.num&&D.hist.some(function(h){return h.num===v.facture}))return "Ce numéro de facture existe déjà dans la liste.";
      ["facture","devis","commande"].forEach(function(k){D[k].num=v[k]});
      docSave();render();
    });
}
async function exportData(){
  var data={app:"amana-packaging",version:1,date:new Date().toISOString(),stock:S,docs:docLoad(),reglages:R};
  var json=JSON.stringify(data,null,1),name="amana-sauvegarde-"+todayStr()+".json";
  var done=false;
  try{
    if(window.claude&&typeof window.claude.use==="function"){
      var dl=await window.claude.use("downloads");
      if(dl){await dl.save({filename:name,data:json});done=true}
    }
  }catch(e){if(e&&e.code==="declined")return}
  if(!done){
    try{
      var b=new Blob([json],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");
      a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u)},3000);done=true;
    }catch(e){}
  }
  openDlg("Sauvegarde",done?"<p>La sauvegarde a été exportée.</p>":"<p>L'export n'a pas pu être effectué. Réessayez.</p>","Fermer",function(){});
}
function readBackup(file){
  file.text().then(function(txt){
    var data=null;
    try{data=JSON.parse(txt)}catch(e){}
    if(!data||data.app!=="amana-packaging"||!data.stock||!Array.isArray(data.stock.produits)){
      openDlg("Importation impossible","<p>Ce fichier n'est pas une sauvegarde AMANA PACKAGING valide.</p>","Fermer",function(){});return;
    }
    openConfirm("Restaurer cette sauvegarde ?","Toutes les données actuelles seront remplacées par celles du fichier ("+data.stock.produits.length+" articles, "+(data.stock.mouvements||[]).length+" opérations).","Restaurer",async function(){
      var st=data.stock,oldIds=S.mouvements.map(function(x){return x.id});
      await tx(function(){
        S={produits:st.produits||[],devise:fixDevise(st.devise),tva:(st.tva!=null&&!isNaN(Number(st.tva))?Number(st.tva):19),mouvements:st.mouvements||[],clients:st.clients||[],fournisseurs:st.fournisseurs||[],types:st.types||[]};
      },async function(){
        if(DB){
          await saveEtat();
          var keep={};S.mouvements.forEach(function(m){keep[m.id]=1});
          for(var i=0;i<oldIds.length;i++)if(!keep[oldIds[i]])await delMvt(oldIds[i]);
          for(var j=0;j<S.mouvements.length;j++)await putMvt(S.mouvements[j]);
        }else saveLocal();
      });
      if(data.docs&&typeof data.docs==="object"){try{localStorage.setItem(DOC_LS,JSON.stringify(data.docs))}catch(e){}DOC=null;docLoad()}
      render();
    });
  }).catch(function(){openDlg("Importation impossible","<p>Le fichier n'a pas pu être lu.</p>","Fermer",function(){})});
}

/* ---------- Démarrage ---------- */
async function init(){
  loadReglages();applyTheme();try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){if(R.theme==="auto")applyTheme()})}catch(e){}loadNot();tickClock();setInterval(tickClock,15000);
  render();
  var db=null;
  try{
    if(window.claude&&typeof window.claude.use==="function"){
      db=await Promise.race([window.claude.use("db"),new Promise(function(r){setTimeout(function(){r(null)},6000)})]);
    }
  }catch(e){db=null}
  if(db){
    DB=db;
    try{await loadDb()}catch(e){DB=null;loadLocal()}
  }else{loadLocal()}
  ready=true;
  render();
}
init();
})();
