name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparer le dossier www
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png www/

      - name: Installer Capacitor
        run: npm install

      - name: Creer le projet Android
        run: npx cap add android

      - name: Icone de l'application
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}
            s=${pair##*:}
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_round.png
            cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_foreground.png
          done
          mkdir -p $RES/drawable
          cp ic_stat_amana.png $RES/drawable/ic_stat_amana.png
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Synchroniser
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AMANA-PACKAGING.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AMANA-PACKAGING-apk
          path: AMANA-PACKAGING.apk

      - name: Publier l'APK dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: AMANA PACKAGING APK ${{ github.run_number }}
          files: AMANA-PACKAGING.apk
